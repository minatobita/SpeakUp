<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>SpeakUp</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0d0d1a;
      min-height: 100vh;
      color: white;
      display: flex;
      flex-direction: column;
    }

    .top-bar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: #0d0d1a;
      padding: env(safe-area-inset-top, 14px) 16px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }

    .app-title {
      text-align: center;
      font-size: 11px;
      color: rgba(255,255,255,0.28);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .start-btn {
      width: 100%;
      height: 80px;
      border-radius: 22px;
      border: none;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: white;
      font-size: 19px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      box-shadow: 0 6px 24px rgba(34,197,94,0.4);
      touch-action: manipulation;
      transition: transform 0.15s;
    }
    .start-btn:active { transform: scale(0.97); }

    #uiRec { display: none; flex-direction: column; gap: 10px; }

    .rec-status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .rec-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #e94560;
      animation: blink 1s ease-in-out infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.1} }
    .rec-time {
      font-size: 14px;
      font-weight: 600;
      color: rgba(255,255,255,0.55);
      font-variant-numeric: tabular-nums;
      letter-spacing: 1px;
    }
    .bg-badge {
      font-size: 10px;
      background: rgba(34,197,94,0.15);
      color: #22c55e;
      padding: 2px 8px;
      border-radius: 8px;
      margin-left: 4px;
    }

    .take-btn {
      width: 100%;
      height: 86px;
      border-radius: 22px;
      border: none;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      color: white;
      font-size: 20px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 6px 28px rgba(99,102,241,0.5);
      touch-action: manipulation;
      transition: transform 0.12s;
      animation: pulseBlue 2s ease-in-out infinite alternate;
      letter-spacing: 0.5px;
    }
    @keyframes pulseBlue {
      from { box-shadow: 0 6px 20px rgba(99,102,241,0.4); }
      to   { box-shadow: 0 6px 38px rgba(99,102,241,0.75); }
    }
    .take-btn:active { transform: scale(0.96); }
    .take-btn.capturing {
      background: linear-gradient(135deg, #f59e0b, #d97706) !important;
      animation: none;
    }
    .take-btn.done {
      background: linear-gradient(135deg, #22c55e, #16a34a) !important;
      animation: none;
    }

    .stop-btn {
      width: 100%;
      height: 50px;
      border-radius: 14px;
      border: 1.5px solid rgba(233,69,96,0.45);
      background: rgba(233,69,96,0.1);
      color: rgba(233,69,96,0.85);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      touch-action: manipulation;
      transition: transform 0.12s, background 0.15s;
    }
    .stop-btn:active { transform: scale(0.96); background: rgba(233,69,96,0.22); }

    .lock-tip {
      margin-top: 2px;
      background: rgba(99,102,241,0.08);
      border: 1px solid rgba(99,102,241,0.2);
      border-radius: 12px;
      padding: 9px 14px;
      font-size: 12px;
      color: rgba(255,255,255,0.5);
      line-height: 1.7;
      text-align: center;
    }
    .lock-tip strong { color: #818cf8; }

    .live-section {
      padding: 12px 16px 0;
      display: none;
    }
    .live-label {
      font-size: 10px;
      color: rgba(255,255,255,0.3);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .live-box {
      padding: 12px 14px;
      background: rgba(255,255,255,0.04);
      border-radius: 14px;
      font-size: 14px;
      color: rgba(255,255,255,0.35);
      font-style: italic;
      min-height: 52px;
      word-break: break-word;
      line-height: 1.65;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .live-box.has-text {
      color: rgba(255,255,255,0.88);
      font-style: normal;
    }

    .alert {
      margin: 10px 16px 0;
      background: rgba(233,69,96,0.1);
      border: 1px solid rgba(233,69,96,0.3);
      border-radius: 12px;
      padding: 11px 14px;
      font-size: 13px;
      color: rgba(255,255,255,0.82);
      line-height: 1.7;
      display: none;
    }

    .transcripts-section {
      flex: 1;
      padding: 14px 16px 80px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .tx-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .tx-title {
      font-size: 11px;
      font-weight: 600;
      color: rgba(255,255,255,0.3);
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .clear-btn {
      display: none;
      background: none;
      border: 1px solid rgba(233,69,96,0.4);
      color: rgba(233,69,96,0.75);
      font-size: 12px;
      padding: 4px 12px;
      border-radius: 20px;
      cursor: pointer;
      touch-action: manipulation;
    }
    .empty-msg {
      text-align: center;
      font-size: 14px;
      color: rgba(255,255,255,0.18);
      margin-top: 32px;
      line-height: 2.5;
    }

    .card {
      background: rgba(255,255,255,0.06);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 10px;
      animation: slideUp 0.3s ease;
    }
    @keyframes slideUp {
      from { opacity:0; transform:translateY(6px); }
      to   { opacity:1; transform:translateY(0); }
    }
    .card-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    .card-time { font-size: 12px; color: rgba(255,255,255,0.3); flex: 1; }
    .card-badge {
      font-size: 11px;
      background: rgba(99,102,241,0.2);
      color: #818cf8;
      padding: 2px 9px;
      border-radius: 9px;
    }
    .card-body {
      font-size: 15px;
      line-height: 1.65;
      color: white;
      word-break: break-word;
    }
    .card-body.no-speech {
      color: rgba(255,255,255,0.27);
      font-style: italic;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <p class="app-title">🎙️ SpeakUp</p>

    <div id="uiIdle">
      <button class="start-btn" onclick="startRec()">
        <span>▶</span><span>Start Recording</span>
      </button>
    </div>

    <div id="uiRec">
      <div class="rec-status">
        <div class="rec-dot"></div>
        <span class="rec-time" id="recTime">00:00:00</span>
        <span class="bg-badge">● BG Active</span>
      </div>

      <button class="take-btn" id="takeBtn" onclick="takeTranscript()">
        📋&nbsp;&nbsp;TAKE TRANSCRIPT
      </button>

      <button class="stop-btn" onclick="stopRec()">
        ⏹&nbsp;&nbsp;STOP
      </button>

      <div class="lock-tip">
        <strong>Lock screen:</strong> tap <strong>⏭ Next</strong> in media controls = Take Transcript
      </div>
    </div>
  </div>

  <div class="live-section" id="liveSection">
    <p class="live-label">🔴 Live · last 5 seconds</p>
    <div class="live-box" id="liveBox">Listening…</div>
  </div>

  <div class="alert" id="alertBox"></div>

  <div class="transcripts-section">
    <div class="tx-header">
      <span class="tx-title">📝 Transcripts</span>
      <button class="clear-btn" id="clearBtn" onclick="clearAll()">Clear All</button>
    </div>
    <div id="cardList">
      <p class="empty-msg">Press Start Recording<br>then tap Take Transcript<br>to save what you said</p>
    </div>
  </div>

<script>
// ═══════════════════════════════════════════════
//  STATE  — single source of truth
// ═══════════════════════════════════════════════

/*
  sessions[] = array of {text: string, endTime: number}
  Each entry is ONE final recognition result with the time it arrived.

  interimText = the latest interim (not-yet-final) result
  interimTime = when interimText last updated (Date.now())

  LIVE BOX: every 200ms → show sessions where endTime >= now-5000, + interim if interimTime >= now-5000
  PURGE:    every 200ms → delete sessions where endTime < now-7000

  TAKE TRANSCRIPT:
    1. Record snapTime = Date.now()
    2. Stop current recognition → forces final result out
    3. Wait 1000ms for iOS to deliver the final result
    4. Collect sessions where endTime >= snapTime-5000 AND endTime <= snapTime+1000
    5. Reset sessions[] and interim
    6. Restart recognition
*/

let sessions    = [];   // [{text, endTime}]
let interimText = '';
let interimTime = 0;

let recog        = null;
let running      = false;
let taking       = false;   // true while takeTranscript is in progress
let elapsedTimer = null;
let liveTimer    = null;
let elapsedSec   = 0;
let audioCtx     = null;

// ── Prevent duplicate finals ──────────────────
// iOS sometimes re-sends the same final text on restart
let recentFinals = []; // [{text, time}] — deduplicate within 3s


// ═══════════════════════════════════════════════
//  RECOGNITION ENGINE
// ═══════════════════════════════════════════════

function buildRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return null;

  const r = new SR();
  r.lang             = 'en-US';
  r.continuous       = false;   // must be false on iOS Safari
  r.interimResults   = true;
  r.maxAlternatives  = 1;

  r.onresult = (e) => {
    const now = Date.now();
    let interim = '';

    for (let i = e.resultIndex; i < e.results.length; i++) {
      const text = e.results[i][0].transcript.trim();
      if (!text) continue;

      if (e.results[i].isFinal) {
        // ── Deduplication: skip if same text seen within 3 seconds ──
        const isDup = recentFinals.some(f =>
          f.text === text && now - f.time < 3000
        );
        if (!isDup) {
          sessions.push({ text, endTime: now });
          recentFinals.push({ text, time: now });
          // Keep recentFinals small
          recentFinals = recentFinals.filter(f => now - f.time < 5000);
        }
        interimText = '';
        interimTime = 0;
      } else {
        interim = text; // always take the latest interim
      }
    }

    if (interim) {
      interimText = interim;
      interimTime = now;
    }
  };

  r.onerror = (e) => {
    if (e.error === 'not-allowed') {
      showAlert('🚫 Microphone access denied. Go to iPhone Settings → Safari → Microphone → Allow.');
      stopRec();
      return;
    }
    // 'no-speech' and 'aborted' are normal during continuous loop — ignore
  };

  r.onend = () => {
    // When a session ends, clear interim
    if (interimText) {
      // If there was interim, it's now gone — clear it
      interimText = '';
      interimTime = 0;
    }
    // Auto-restart unless we're stopping or in the middle of a takeTranscript
    if (running && !taking) {
      setTimeout(() => {
        if (running && !taking) startRecognition();
      }, 150);
    }
  };

  return r;
}

function startRecognition() {
  if (!running) return;
  recog = buildRecognition();
  if (!recog) {
    showAlert('Speech recognition is not supported. Please use Safari on iPhone.');
    return;
  }
  try {
    recog.start();
  } catch (err) {
    console.warn('recog.start error:', err);
    setTimeout(() => { if (running && !taking) startRecognition(); }, 300);
  }
}

function stopRecognition() {
  if (recog) {
    try { recog.abort(); } catch (e) {}
    recog = null;
  }
}


// ═══════════════════════════════════════════════
//  LIVE DISPLAY — runs every 200ms
// ═══════════════════════════════════════════════

function updateLive() {
  if (!running) return;

  const now    = Date.now();
  const cutoff = now - 5000;     // show last 5 seconds
  const purge  = now - 7000;     // delete sessions older than 7 seconds

  // 1. PURGE old sessions permanently
  sessions = sessions.filter(s => s.endTime >= purge);
  recentFinals = recentFinals.filter(f => now - f.time < 5000);

  // 2. COLLECT sessions within 5-second window
  const parts = sessions
    .filter(s => s.endTime >= cutoff)
    .map(s => s.text);

  // 3. Add interim if it's within the window
  if (interimText && interimTime >= cutoff) {
    parts.push(interimText);
  }

  // 4. Display
  const text = parts.join(' ').trim();
  const box  = document.getElementById('liveBox');
  if (text) {
    box.textContent = text;
    box.classList.add('has-text');
  } else {
    box.textContent = '🎤 Listening…';
    box.classList.remove('has-text');
  }
}


// ═══════════════════════════════════════════════
//  TAKE TRANSCRIPT
// ═══════════════════════════════════════════════

function takeTranscript() {
  if (!running || taking) return;
  taking = true;

  const snapTime = Date.now();
  const btn = document.getElementById('takeBtn');
  btn.innerHTML = '⏳&nbsp;&nbsp;Capturing…';
  btn.classList.add('capturing');
  btn.disabled = true;

  // Stop current recognition to force a final result out
  if (recog) {
    try { recog.stop(); } catch (e) {}
  }

  // Wait 1000ms for iOS to deliver any pending final result
  setTimeout(() => {
    // Collect sessions: spoken within 5 seconds BEFORE button press
    // Plus up to 1 second AFTER (to catch delayed finals)
    const windowStart = snapTime - 5000;
    const windowEnd   = snapTime + 1000;

    const parts = sessions
      .filter(s => s.endTime >= windowStart && s.endTime <= windowEnd)
      .map(s => s.text);

    // Also grab interim if it's in window
    if (interimText && interimTime >= windowStart) {
      parts.push(interimText);
    }

    const text = parts.join(' ').trim();

    // ── RESET for the next take ──
    sessions    = [];
    interimText = '';
    interimTime = 0;
    recentFinals = [];

    // ── Save transcript card ──
    addCard(text || '');

    // ── Reset button ──
    btn.innerHTML = '✅&nbsp;&nbsp;Saved!';
    btn.classList.remove('capturing');
    btn.classList.add('done');
    setTimeout(() => {
      btn.innerHTML = '📋&nbsp;&nbsp;TAKE TRANSCRIPT';
      btn.classList.remove('done');
      btn.disabled = false;
    }, 1500);

    // ── Restart recognition ──
    taking = false;
    if (running) startRecognition();

  }, 1000);
}


// ═══════════════════════════════════════════════
//  START / STOP
// ═══════════════════════════════════════════════

async function startRec() {
  // Request mic permission first (required on iOS)
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    stream.getTracks().forEach(t => t.stop()); // release; we only needed permission
  } catch (err) {
    showAlert('🚫 Microphone access denied. Go to iPhone Settings → Safari → Microphone → Allow.');
    return;
  }

  // Keep-alive AudioContext (prevents iOS from suspending the tab)
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const oscillator = audioCtx.createOscillator();
    const gainNode   = audioCtx.createGain();
    gainNode.gain.value = 0.0001; // silent
    oscillator.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    oscillator.start();
  } catch (e) {}

  // MediaSession for lock-screen control
  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: 'SpeakUp 🎤',
      artist: 'Recording in progress',
    });
    navigator.mediaSession.setActionHandler('nexttrack', () => takeTranscript());
  }

  // Reset state
  sessions     = [];
  interimText  = '';
  interimTime  = 0;
  recentFinals = [];
  taking       = false;
  running      = true;
  elapsedSec   = 0;

  // UI
  document.getElementById('uiIdle').style.display  = 'none';
  document.getElementById('uiRec').style.display   = 'flex';
  document.getElementById('liveSection').style.display = 'block';
  document.getElementById('liveBox').textContent   = '🎤 Listening…';
  document.getElementById('liveBox').classList.remove('has-text');

  // Timers
  elapsedTimer = setInterval(() => {
    elapsedSec++;
    const h = String(Math.floor(elapsedSec / 3600)).padStart(2, '0');
    const m = String(Math.floor((elapsedSec % 3600) / 60)).padStart(2, '0');
    const s = String(elapsedSec % 60).padStart(2, '0');
    document.getElementById('recTime').textContent = `${h}:${m}:${s}`;
  }, 1000);

  liveTimer = setInterval(updateLive, 200);

  // Start recognition
  startRecognition();
}

function stopRec() {
  running = false;
  taking  = false;

  clearInterval(elapsedTimer);
  clearInterval(liveTimer);
  stopRecognition();

  if (audioCtx) { try { audioCtx.close(); } catch (e) {} audioCtx = null; }

  if ('mediaSession' in navigator) {
    try { navigator.mediaSession.setActionHandler('nexttrack', null); } catch (e) {}
  }

  // Reset state
  sessions     = [];
  interimText  = '';
  interimTime  = 0;
  recentFinals = [];

  // UI
  document.getElementById('uiIdle').style.display  = 'block';
  document.getElementById('uiRec').style.display   = 'none';
  document.getElementById('liveSection').style.display = 'none';
  document.getElementById('recTime').textContent   = '00:00:00';

  const btn = document.getElementById('takeBtn');
  btn.innerHTML = '📋&nbsp;&nbsp;TAKE TRANSCRIPT';
  btn.classList.remove('capturing', 'done');
  btn.disabled = false;
}


// ═══════════════════════════════════════════════
//  CARDS
// ═══════════════════════════════════════════════

function addCard(text) {
  const list = document.getElementById('cardList');

  // Remove empty-state message
  const empty = list.querySelector('.empty-msg');
  if (empty) empty.remove();

  const now = new Date();
  const ts  = now.toTimeString().slice(0, 8);

  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="card-head">
      <span class="card-time">${ts}</span>
      <span class="card-badge">last 5s</span>
    </div>
    <div class="card-body ${!text ? 'no-speech' : ''}">
      ${text || '(no speech detected in the last 5 seconds)'}
    </div>`;

  list.insertBefore(card, list.firstChild);

  document.getElementById('clearBtn').style.display = 'block';
}

function clearAll() {
  const list = document.getElementById('cardList');
  list.innerHTML = '<p class="empty-msg">Press Start Recording<br>then tap Take Transcript<br>to save what you said</p>';
  document.getElementById('clearBtn').style.display = 'none';
}


// ═══════════════════════════════════════════════
//  ALERT
// ═══════════════════════════════════════════════

function showAlert(msg) {
  const box = document.getElementById('alertBox');
  box.textContent = msg;
  box.style.display = 'block';
  setTimeout(() => { box.style.display = 'none'; }, 8000);
}
</script>
</body>
</html>

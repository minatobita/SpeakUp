<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>SpeakUp</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0d0d1a;
      min-height: 100vh;
      color: white;
      display: flex;
      flex-direction: column;
    }

    .top-bar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: #0d0d1a;
      padding: env(safe-area-inset-top, 14px) 16px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }

    .app-title {
      text-align: center;
      font-size: 11px;
      color: rgba(255,255,255,0.28);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .start-btn {
      width: 100%;
      height: 80px;
      border-radius: 22px;
      border: none;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: white;
      font-size: 19px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      box-shadow: 0 6px 24px rgba(34,197,94,0.4);
      touch-action: manipulation;
      transition: transform 0.15s;
    }
    .start-btn:active { transform: scale(0.97); }

    #uiRec { display: none; flex-direction: column; gap: 10px; }

    .rec-status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .rec-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #e94560;
      animation: blink 1s ease-in-out infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.1} }
    .rec-time {
      font-size: 14px;
      font-weight: 600;
      color: rgba(255,255,255,0.55);
      font-variant-numeric: tabular-nums;
      letter-spacing: 1px;
    }
    .bg-badge {
      font-size: 10px;
      background: rgba(34,197,94,0.15);
      color: #22c55e;
      padding: 2px 8px;
      border-radius: 8px;
      margin-left: 4px;
    }

    .take-btn {
      width: 100%;
      height: 86px;
      border-radius: 22px;
      border: none;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      color: white;
      font-size: 20px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 6px 28px rgba(99,102,241,0.5);
      touch-action: manipulation;
      transition: transform 0.12s;
      animation: pulseBlue 2s ease-in-out infinite alternate;
      letter-spacing: 0.5px;
    }
    @keyframes pulseBlue {
      from { box-shadow: 0 6px 20px rgba(99,102,241,0.4); }
      to   { box-shadow: 0 6px 38px rgba(99,102,241,0.75); }
    }
    .take-btn:active { transform: scale(0.96); }
    .take-btn.capturing {
      background: linear-gradient(135deg, #f59e0b, #d97706) !important;
      animation: none;
    }
    .take-btn.done {
      background: linear-gradient(135deg, #22c55e, #16a34a) !important;
      animation: none;
    }

    .stop-btn {
      width: 100%;
      height: 50px;
      border-radius: 14px;
      border: 1.5px solid rgba(233,69,96,0.45);
      background: rgba(233,69,96,0.1);
      color: rgba(233,69,96,0.85);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      touch-action: manipulation;
      transition: transform 0.12s, background 0.15s;
    }
    .stop-btn:active { transform: scale(0.96); background: rgba(233,69,96,0.22); }

    .lock-tip {
      margin-top: 2px;
      background: rgba(99,102,241,0.08);
      border: 1px solid rgba(99,102,241,0.2);
      border-radius: 12px;
      padding: 9px 14px;
      font-size: 12px;
      color: rgba(255,255,255,0.5);
      line-height: 1.7;
      text-align: center;
    }
    .lock-tip strong { color: #818cf8; }

    .live-section {
      padding: 12px 16px 0;
      display: none;
    }
    .live-label {
      font-size: 10px;
      color: rgba(255,255,255,0.3);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .live-box {
      padding: 12px 14px;
      background: rgba(255,255,255,0.04);
      border-radius: 14px;
      font-size: 14px;
      color: rgba(255,255,255,0.35);
      font-style: italic;
      min-height: 52px;
      word-break: break-word;
      line-height: 1.65;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .live-box.has-text {
      color: rgba(255,255,255,0.88);
      font-style: normal;
    }

    .alert {
      margin: 10px 16px 0;
      background: rgba(233,69,96,0.1);
      border: 1px solid rgba(233,69,96,0.3);
      border-radius: 12px;
      padding: 11px 14px;
      font-size: 13px;
      color: rgba(255,255,255,0.82);
      line-height: 1.7;
      display: none;
    }

    .transcripts-section {
      flex: 1;
      padding: 14px 16px 80px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .tx-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .tx-title {
      font-size: 11px;
      font-weight: 600;
      color: rgba(255,255,255,0.3);
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .clear-btn {
      display: none;
      background: none;
      border: 1px solid rgba(233,69,96,0.4);
      color: rgba(233,69,96,0.75);
      font-size: 12px;
      padding: 4px 12px;
      border-radius: 20px;
      cursor: pointer;
      touch-action: manipulation;
    }
    .empty-msg {
      text-align: center;
      font-size: 14px;
      color: rgba(255,255,255,0.18);
      margin-top: 32px;
      line-height: 2.5;
    }

    .card {
      background: rgba(255,255,255,0.06);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 10px;
      animation: slideUp 0.3s ease;
    }
    @keyframes slideUp {
      from { opacity:0; transform:translateY(6px); }
      to   { opacity:1; transform:translateY(0); }
    }
    .card-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    .card-time { font-size: 12px; color: rgba(255,255,255,0.3); flex: 1; }
    .card-badge {
      font-size: 11px;
      background: rgba(99,102,241,0.2);
      color: #818cf8;
      padding: 2px 9px;
      border-radius: 9px;
    }
    .card-body {
      font-size: 15px;
      line-height: 1.65;
      color: white;
      word-break: break-word;
    }
    .card-body.no-speech {
      color: rgba(255,255,255,0.27);
      font-style: italic;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <p class="app-title">🎙️ SpeakUp</p>

    <div id="uiIdle">
      <button class="start-btn" onclick="startRec()">
        <span>▶</span><span>Start Recording</span>
      </button>
    </div>

    <div id="uiRec">
      <div class="rec-status">
        <div class="rec-dot"></div>
        <span class="rec-time" id="recTime">00:00:00</span>
        <span class="bg-badge">● BG Active</span>
      </div>

      <button class="take-btn" id="takeBtn" onclick="takeTranscript()">
        📋&nbsp;&nbsp;TAKE TRANSCRIPT
      </button>

      <button class="stop-btn" onclick="stopRec()">
        ⏹&nbsp;&nbsp;STOP
      </button>

      <div class="lock-tip">
        <strong>Lock screen:</strong> tap <strong>⏭ Next</strong> in media controls = Take Transcript
      </div>
    </div>
  </div>

  <div class="live-section" id="liveSection">
    <p class="live-label">🔴 Live · last 5 seconds</p>
    <div class="live-box" id="liveBox">Listening…</div>
  </div>

  <div class="alert" id="alertBox"></div>

  <div class="transcripts-section" id="txSection">
    <div class="tx-header">
      <span class="tx-title">📝 Transcripts</span>
      <button class="clear-btn" id="clearBtn" onclick="clearCards()">Clear</button>
    </div>
    <p class="empty-msg" id="emptyMsg">
      Press ▶ Start Recording<br>
      then 📋 Take Transcript<br>
      to capture what you said
    </p>
  </div>

  <script>
  // ═══════════════════════════════════════════════
  //  SINGLE SOURCE OF TRUTH
  //  entries[] = [{text, time}]  ← FINAL results only
  //  interimText, interimTime    ← current partial
  // ═══════════════════════════════════════════════

  let entries      = [];   // final results with timestamps
  let interimText  = '';
  let interimTime  = 0;

  let isRecording  = false;
  let recognition  = null;
  let isTaking     = false;

  let recTimerID   = null;
  let liveTimerID  = null;
  let purgeTimerID = null;
  let recStart     = null;

  // ─── getLast5s ─────────────────────────────────
  // THE ONLY function that reads entries.
  // Returns text spoken between (refTime - 5000) and refTime.
  function getLast5s(refTime) {
    const cutoff = refTime - 5000;
    const parts = [];

    for (const e of entries) {
      if (e.time >= cutoff && e.time <= refTime) {
        parts.push(e.text);
      }
    }

    // Add interim if it falls in the window
    if (interimText && interimTime >= cutoff && interimTime <= refTime) {
      parts.push(interimText);
    }

    return parts.join(' ').trim();
  }

  // ─── purgeOld ──────────────────────────────────
  // Keep only last 10 seconds in entries[] to prevent growth.
  // Called every 500ms.
  function purgeOld() {
    const keep = Date.now() - 10000;
    entries = entries.filter(e => e.time >= keep);
  }

  // ─── updateLive ────────────────────────────────
  // Called every 100ms. Shows getLast5s(now) in the live box.
  function updateLive() {
    const text = getLast5s(Date.now());
    const box  = document.getElementById('liveBox');
    if (text) {
      box.textContent = text;
      box.classList.add('has-text');
    } else {
      box.textContent = 'Listening…';
      box.classList.remove('has-text');
    }
  }

  // ─── startRecognition ──────────────────────────
  // Starts one recognition session. Restarts itself on end.
  function startRecognition() {
    if (!isRecording) return;

    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      showAlert('Speech Recognition is not supported in this browser. Please use Safari on iPhone.');
      return;
    }

    recognition = new SR();
    recognition.continuous      = false;  // iOS works best with false + auto-restart
    recognition.interimResults  = true;
    recognition.lang            = 'en-US';
    recognition.maxAlternatives = 1;

    // Track the last final text to prevent duplicates across restarts
    let lastFinal = '';

    recognition.onresult = function(e) {
      let finalStr  = '';
      let interimStr = '';

      for (let i = e.resultIndex; i < e.results.length; i++) {
        const t = e.results[i][0].transcript.trim();
        if (e.results[i].isFinal) {
          finalStr += (finalStr ? ' ' : '') + t;
        } else {
          interimStr += (interimStr ? ' ' : '') + t;
        }
      }

      // Update interim
      if (interimStr) {
        interimText = interimStr;
        interimTime = Date.now();
      }

      // Add final to entries (skip duplicates)
      if (finalStr && finalStr !== lastFinal) {
        lastFinal = finalStr;
        entries.push({ text: finalStr, time: Date.now() });
        interimText = '';
        interimTime = 0;
      }
    };

    recognition.onend = function() {
      interimText = '';
      interimTime = 0;
      if (isRecording) {
        setTimeout(startRecognition, 150);
      }
    };

    recognition.onerror = function(e) {
      interimText = '';
      interimTime = 0;
      // no-speech and network errors are normal – just restart
    };

    try {
      recognition.start();
    } catch(err) {
      setTimeout(startRecognition, 300);
    }
  }

  // ─── startRec ──────────────────────────────────
  function startRec() {
    if (isRecording) return;
    hideAlert();

    navigator.mediaDevices.getUserMedia({ audio: true }).then(function() {

      isRecording  = true;
      entries      = [];
      interimText  = '';
      interimTime  = 0;
      recStart     = Date.now();

      document.getElementById('uiIdle').style.display   = 'none';
      document.getElementById('uiRec').style.display    = 'flex';
      document.getElementById('liveSection').style.display = 'block';

      // Start recognition loop
      startRecognition();

      // Recording timer (HH:MM:SS)
      recTimerID = setInterval(function() {
        const s   = Math.floor((Date.now() - recStart) / 1000);
        const h   = String(Math.floor(s / 3600)).padStart(2, '0');
        const m   = String(Math.floor((s % 3600) / 60)).padStart(2, '0');
        const sec = String(s % 60).padStart(2, '0');
        document.getElementById('recTime').textContent = h + ':' + m + ':' + sec;
      }, 1000);

      // Live box refresh
      liveTimerID = setInterval(updateLive, 100);

      // Purge old entries
      purgeTimerID = setInterval(purgeOld, 500);

      // Lock screen media controls
      setupMediaSession();

      // Silent audio to keep background alive
      startSilentAudio();

    }).catch(function() {
      showAlert('⚠️ Microphone access denied. Go to iPhone Settings → Safari → Microphone → Allow.');
    });
  }

  // ─── stopRec ───────────────────────────────────
  function stopRec() {
    isRecording = false;
    if (recognition) { try { recognition.stop(); } catch(e) {} recognition = null; }
    clearInterval(recTimerID);
    clearInterval(liveTimerID);
    clearInterval(purgeTimerID);

    entries     = [];
    interimText = '';
    interimTime = 0;
    isTaking    = false;

    document.getElementById('uiIdle').style.display      = 'block';
    document.getElementById('uiRec').style.display       = 'none';
    document.getElementById('liveSection').style.display = 'none';

    const box = document.getElementById('liveBox');
    box.textContent = 'Listening…';
    box.classList.remove('has-text');

    const btn = document.getElementById('takeBtn');
    btn.className = 'take-btn';
    btn.innerHTML = '📋&nbsp;&nbsp;TAKE TRANSCRIPT';
  }

  // ─── takeTranscript ────────────────────────────
  // Snap the time, wait 1.5 s for late arrivals, then save.
  function takeTranscript() {
    if (isTaking || !isRecording) return;
    isTaking = true;

    const btn      = document.getElementById('takeBtn');
    btn.classList.add('capturing');
    btn.innerHTML  = '⏳&nbsp;&nbsp;CAPTURING…';
    btn.style.animation = 'none';

    const snapTime = Date.now();

    setTimeout(function() {
      // Window: from (snapTime - 5000) to (snapTime + 1500)
      const captureEnd = snapTime + 1500;
      const text = getLast5s(captureEnd);

      // Save card
      addCard(text);

      // Remove captured entries so next Take Transcript starts fresh
      entries = entries.filter(function(e) { return e.time > captureEnd; });
      interimText = '';
      interimTime = 0;

      btn.classList.remove('capturing');
      btn.classList.add('done');
      btn.innerHTML = '✅&nbsp;&nbsp;SAVED!';

      setTimeout(function() {
        btn.classList.remove('done');
        btn.classList.remove('capturing');
        btn.innerHTML = '📋&nbsp;&nbsp;TAKE TRANSCRIPT';
        btn.style.animation = '';
        isTaking = false;
      }, 1000);

    }, 1500);
  }

  // ─── addCard ───────────────────────────────────
  function addCard(text) {
    const section = document.getElementById('txSection');
    const empty   = document.getElementById('emptyMsg');
    const header  = section.querySelector('.tx-header');

    if (empty) empty.style.display = 'none';
    document.getElementById('clearBtn').style.display = 'inline-block';

    const now  = new Date();
    const time = now.toLocaleTimeString('ja-JP', { hour12: false });

    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML =
      '<div class="card-head">' +
        '<span class="card-time">' + time + '</span>' +
        '<span class="card-badge">Last 5s</span>' +
      '</div>' +
      '<div class="card-body' + (text ? '' : ' no-speech') + '">' +
        (text || '(No speech detected)') +
      '</div>';

    // Insert after header
    if (header && header.nextSibling) {
      section.insertBefore(card, header.nextSibling);
    } else {
      section.appendChild(card);
    }
  }

  // ─── clearCards ────────────────────────────────
  function clearCards() {
    const section = document.getElementById('txSection');
    section.querySelectorAll('.card').forEach(function(c) { c.remove(); });
    document.getElementById('emptyMsg').style.display = 'block';
    document.getElementById('clearBtn').style.display = 'none';
  }

  // ─── MediaSession (lock screen ⏭ = Take Transcript) ───
  function setupMediaSession() {
    if (!('mediaSession' in navigator)) return;
    try {
      navigator.mediaSession.metadata = new MediaMetadata({
        title:  'SpeakUp 🎤',
        artist: 'Recording in progress…',
        album:  'Tap ⏭ Next = Take Transcript'
      });
      navigator.mediaSession.setActionHandler('nexttrack', takeTranscript);
      navigator.mediaSession.setActionHandler('play',  function() {});
      navigator.mediaSession.setActionHandler('pause', function() {});
    } catch(e) {}
  }

  // ─── Silent Audio (keeps iOS tab alive in background) ──
  function startSilentAudio() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const buf = ctx.createBuffer(1, ctx.sampleRate * 3600, ctx.sampleRate);
      const src = ctx.createBufferSource();
      src.buffer = buf;
      src.loop   = true;
      src.connect(ctx.destination);
      src.start(0);
    } catch(e) {}
  }

  // ─── Alert helpers ─────────────────────────────
  function showAlert(msg) {
    const box = document.getElementById('alertBox');
    box.textContent = msg;
    box.style.display = 'block';
  }
  function hideAlert() {
    document.getElementById('alertBox').style.display = 'none';
  }
  </script>
</body>
</html>

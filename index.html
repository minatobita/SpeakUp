<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>SpeakUp</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0d0d1a;
      min-height: 100vh;
      color: white;
      display: flex;
      flex-direction: column;
    }

    .top-bar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: #0d0d1a;
      padding: env(safe-area-inset-top, 14px) 16px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }

    .app-title {
      text-align: center;
      font-size: 11px;
      color: rgba(255,255,255,0.28);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .start-btn {
      width: 100%;
      height: 80px;
      border-radius: 22px;
      border: none;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: white;
      font-size: 19px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      box-shadow: 0 6px 24px rgba(34,197,94,0.4);
      touch-action: manipulation;
      transition: transform 0.15s;
    }
    .start-btn:active { transform: scale(0.97); }

    #uiRec { display: none; flex-direction: column; gap: 10px; }

    .rec-status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .rec-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #e94560;
      animation: blink 1s ease-in-out infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.1} }
    .rec-time {
      font-size: 14px;
      font-weight: 600;
      color: rgba(255,255,255,0.55);
      font-variant-numeric: tabular-nums;
      letter-spacing: 1px;
    }
    .bg-badge {
      font-size: 10px;
      background: rgba(34,197,94,0.15);
      color: #22c55e;
      padding: 2px 8px;
      border-radius: 8px;
      margin-left: 4px;
    }

    .take-btn {
      width: 100%;
      height: 86px;
      border-radius: 22px;
      border: none;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      color: white;
      font-size: 20px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 6px 28px rgba(99,102,241,0.5);
      touch-action: manipulation;
      transition: transform 0.12s;
      animation: pulseBlue 2s ease-in-out infinite alternate;
      letter-spacing: 0.5px;
    }
    @keyframes pulseBlue {
      from { box-shadow: 0 6px 20px rgba(99,102,241,0.4); }
      to   { box-shadow: 0 6px 38px rgba(99,102,241,0.75); }
    }
    .take-btn:active { transform: scale(0.96); }
    .take-btn.capturing {
      background: linear-gradient(135deg, #f59e0b, #d97706) !important;
      animation: none;
    }
    .take-btn.done {
      background: linear-gradient(135deg, #22c55e, #16a34a) !important;
      animation: none;
    }

    .stop-btn {
      width: 100%;
      height: 50px;
      border-radius: 14px;
      border: 1.5px solid rgba(233,69,96,0.45);
      background: rgba(233,69,96,0.1);
      color: rgba(233,69,96,0.85);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      touch-action: manipulation;
      transition: transform 0.12s, background 0.15s;
    }
    .stop-btn:active { transform: scale(0.96); background: rgba(233,69,96,0.22); }

    .lock-tip {
      margin-top: 2px;
      background: rgba(99,102,241,0.08);
      border: 1px solid rgba(99,102,241,0.2);
      border-radius: 12px;
      padding: 9px 14px;
      font-size: 12px;
      color: rgba(255,255,255,0.5);
      line-height: 1.7;
      text-align: center;
    }
    .lock-tip strong { color: #818cf8; }

    .live-section {
      padding: 12px 16px 0;
      display: none;
    }
    .live-label {
      font-size: 10px;
      color: rgba(255,255,255,0.3);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .live-box {
      padding: 12px 14px;
      background: rgba(255,255,255,0.04);
      border-radius: 14px;
      font-size: 14px;
      color: rgba(255,255,255,0.35);
      font-style: italic;
      min-height: 52px;
      word-break: break-word;
      line-height: 1.65;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .live-box.has-text {
      color: rgba(255,255,255,0.88);
      font-style: normal;
    }

    .alert {
      margin: 10px 16px 0;
      background: rgba(233,69,96,0.1);
      border: 1px solid rgba(233,69,96,0.3);
      border-radius: 12px;
      padding: 11px 14px;
      font-size: 13px;
      color: rgba(255,255,255,0.82);
      line-height: 1.7;
      display: none;
    }

    .transcripts-section {
      flex: 1;
      padding: 14px 16px 80px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .tx-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .tx-title {
      font-size: 11px;
      font-weight: 600;
      color: rgba(255,255,255,0.3);
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .clear-btn {
      display: none;
      background: none;
      border: 1px solid rgba(233,69,96,0.4);
      color: rgba(233,69,96,0.75);
      font-size: 12px;
      padding: 4px 12px;
      border-radius: 20px;
      cursor: pointer;
      touch-action: manipulation;
    }
    .empty-msg {
      text-align: center;
      font-size: 14px;
      color: rgba(255,255,255,0.18);
      margin-top: 32px;
      line-height: 2.5;
    }

    .card {
      background: rgba(255,255,255,0.06);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 10px;
      animation: slideUp 0.3s ease;
    }
    @keyframes slideUp {
      from { opacity:0; transform:translateY(6px); }
      to   { opacity:1; transform:translateY(0); }
    }
    .card-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    .card-time { font-size: 12px; color: rgba(255,255,255,0.3); flex: 1; }
    .card-badge {
      font-size: 11px;
      background: rgba(99,102,241,0.2);
      color: #818cf8;
      padding: 2px 9px;
      border-radius: 9px;
    }
    .card-body {
      font-size: 15px;
      line-height: 1.65;
      color: white;
      word-break: break-word;
    }
    .card-body.no-speech {
      color: rgba(255,255,255,0.27);
      font-style: italic;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <p class="app-title">🎙️ SpeakUp</p>

    <div id="uiIdle">
      <button class="start-btn" onclick="startRec()">
        <span>▶</span><span>Start Recording</span>
      </button>
    </div>

    <div id="uiRec">
      <div class="rec-status">
        <div class="rec-dot"></div>
        <span class="rec-time" id="recTime">00:00:00</span>
        <span class="bg-badge">● BG Active</span>
      </div>

      <button class="take-btn" id="takeBtn" onclick="takeTranscript()">
        📋&nbsp;&nbsp;TAKE TRANSCRIPT
      </button>

      <button class="stop-btn" onclick="stopRec()">
        ⏹&nbsp;&nbsp;STOP
      </button>

      <div class="lock-tip">
        <strong>Lock screen:</strong> tap <strong>⏭ Next</strong> in media controls = Take Transcript
      </div>
    </div>
  </div>

  <div class="live-section" id="liveSection">
    <p class="live-label">🔴 Live · last 5 seconds</p>
    <div class="live-box" id="liveBox">Listening…</div>
  </div>

  <div class="alert" id="alertBox"></div>

  <div class="transcripts-section">
    <div class="tx-header">
      <span class="tx-title">📝 Transcripts</span>
      <button class="clear-btn" id="clearBtn" onclick="clearAll()">Clear All</button>
    </div>
    <div id="cardList">
      <p class="empty-msg">Press ▶ Start Recording<br>then 📋 Take Transcript<br>to save what you said</p>
    </div>
  </div>

<script>
// ═══════════════════════════════════════════════════
//  NEW ARCHITECTURE: 5-second session chunks
//  Each recognition session runs for max 5 seconds,
//  then restarts. Each chunk is stored with timestamps.
//  No word-level timestamping → no drift, no duplication.
// ═══════════════════════════════════════════════════

const SESSION_MS = 4800;  // force restart every ~5 seconds
const BUFFER_MS  = 12000; // keep last 12 seconds of chunks
const WAIT_MS    = 1500;  // wait after Take Transcript for late speech

let isRecording    = false;
let chunks         = [];   // [{text, startTime, endTime}]
let currentInterim = '';
let currentSessionStart = 0;
let recognition    = null;
let sessionTimer   = null;
let liveTimer      = null;
let elapsedTimer   = null;
let elapsedSecs    = 0;
let mediaStream    = null;
let silentCtx      = null;
let isTaking       = false; // prevent double-tap

// ─── Silent audio: keep iOS alive in background ───
function startSilentAudio() {
  try {
    silentCtx = new (window.AudioContext || window.webkitAudioContext)();
    const buf = silentCtx.createBuffer(1, silentCtx.sampleRate * 3, silentCtx.sampleRate);
    function loop() {
      if (!isRecording) return;
      const src = silentCtx.createBufferSource();
      src.buffer = buf;
      src.connect(silentCtx.destination);
      src.onended = loop;
      src.start();
    }
    loop();
  } catch(e) { console.log('Silent audio failed:', e); }
}

// ─── Lock screen media session ─────────────────────
function setupMediaSession() {
  if (!('mediaSession' in navigator)) return;
  navigator.mediaSession.metadata = new MediaMetadata({
    title: 'SpeakUp 🎤',
    artist: 'Recording in progress…',
    album: 'Tap ⏭ to Take Transcript'
  });
  navigator.mediaSession.setActionHandler('nexttrack', () => takeTranscript());
  navigator.mediaSession.setActionHandler('previoustrack', () => takeTranscript());
}

// ─── Time format ───────────────────────────────────
function formatTime(s) {
  const h = String(Math.floor(s / 3600)).padStart(2, '0');
  const m = String(Math.floor((s % 3600) / 60)).padStart(2, '0');
  const ss = String(s % 60).padStart(2, '0');
  return `${h}:${m}:${ss}`;
}

// ─── Show alert ────────────────────────────────────
function showAlert(msg) {
  const el = document.getElementById('alertBox');
  el.textContent = msg;
  el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 5000);
}

// ═══════════════════════════════════════════════════
//  START RECORDING
// ═══════════════════════════════════════════════════
async function startRec() {
  // 1. Get mic permission first
  try {
    mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch(e) {
    showAlert('⚠️ Microphone permission denied. Please allow access in Safari Settings.');
    return;
  }

  isRecording    = true;
  chunks         = [];
  currentInterim = '';
  elapsedSecs    = 0;
  isTaking       = false;

  document.getElementById('uiIdle').style.display  = 'none';
  document.getElementById('uiRec').style.display   = 'flex';
  document.getElementById('liveSection').style.display = 'block';

  startSilentAudio();
  setupMediaSession();

  elapsedTimer = setInterval(() => {
    elapsedSecs++;
    document.getElementById('recTime').textContent = formatTime(elapsedSecs);
  }, 1000);

  // Update live box every 200ms
  liveTimer = setInterval(updateLive, 200);

  // Start first 5-second session
  startSession();
}

// ═══════════════════════════════════════════════════
//  5-SECOND SESSION
//  Each session runs for SESSION_MS then auto-restarts.
//  Result stored as one chunk with startTime / endTime.
// ═══════════════════════════════════════════════════
function startSession() {
  if (!isRecording) return;

  currentSessionStart = Date.now();
  currentInterim      = '';

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { showAlert('Speech recognition not supported. Use Safari on iPhone.'); return; }

  recognition = new SR();
  recognition.continuous      = false; // iOS requirement
  recognition.interimResults  = true;
  recognition.lang            = 'en-US';
  recognition.maxAlternatives = 1;

  let sessionFinal = '';

  recognition.onresult = (e) => {
    let interim = '';
    let final   = '';
    for (let i = 0; i < e.results.length; i++) {
      if (e.results[i].isFinal) {
        final += e.results[i][0].transcript + ' ';
      } else {
        interim += e.results[i][0].transcript;
      }
    }
    if (final.trim()) sessionFinal = final.trim();
    currentInterim = interim;
  };

  recognition.onend = () => {
    clearTimeout(sessionTimer);

    // ── Store this session's result as one chunk ──
    if (sessionFinal.trim()) {
      chunks.push({
        text:      sessionFinal.trim(),
        startTime: currentSessionStart,
        endTime:   Date.now()
      });
    }

    // ── Purge chunks older than BUFFER_MS ─────────
    const purge = Date.now() - BUFFER_MS;
    chunks = chunks.filter(c => c.endTime >= purge);

    currentInterim = '';
    sessionFinal   = '';

    // ── Restart immediately ───────────────────────
    if (isRecording) {
      setTimeout(startSession, 100);
    }
  };

  recognition.onerror = (e) => {
    // 'no-speech' and 'aborted' are normal — onend will restart
    if (e.error !== 'no-speech' && e.error !== 'aborted') {
      console.log('SR error:', e.error);
    }
  };

  try {
    recognition.start();
  } catch(e) {
    console.log('recognition.start() error:', e);
    if (isRecording) setTimeout(startSession, 500);
  }

  // Force-stop after SESSION_MS → triggers onend → restarts
  sessionTimer = setTimeout(() => {
    try { recognition.stop(); } catch(e) {}
  }, SESSION_MS);
}

// ═══════════════════════════════════════════════════
//  LIVE BOX — shows last 5 seconds only
// ═══════════════════════════════════════════════════
function updateLive() {
  const now    = Date.now();
  const cutoff = now - 5000;

  const text = chunks
    .filter(c => c.endTime >= cutoff)
    .map(c => c.text)
    .join(' ')
    .trim();

  // Also show current session's interim (real-time)
  const combined = [text, currentInterim].filter(Boolean).join(' ').trim();

  const box = document.getElementById('liveBox');
  if (combined) {
    box.textContent = combined;
    box.classList.add('has-text');
  } else {
    box.textContent = '🎤 Listening…';
    box.classList.remove('has-text');
  }
}

// ═══════════════════════════════════════════════════
//  TAKE TRANSCRIPT
//  Records snapTime, waits WAIT_MS for late speech,
//  then grabs all chunks in [snapTime-5s, snapTime+WAIT_MS].
//  Resets chunks so old data never carries over.
// ═══════════════════════════════════════════════════
function takeTranscript() {
  if (isTaking) return; // prevent double-tap during wait
  isTaking = true;

  const btn      = document.getElementById('takeBtn');
  btn.classList.add('capturing');
  btn.innerHTML  = '⏳&nbsp;&nbsp;Capturing…';
  btn.disabled   = true;

  const snapTime = Date.now();

  setTimeout(() => {
    const cutoff     = snapTime - 5000;
    const captureEnd = snapTime + WAIT_MS;

    const text = chunks
      .filter(c => c.endTime >= cutoff && c.startTime <= captureEnd)
      .map(c => c.text)
      .join(' ')
      .trim();

    addCard(text || '(no speech detected in the last 5 seconds)');

    // ── Remove captured chunks so they don't appear next time ──
    chunks = chunks.filter(c => c.endTime > captureEnd);

    btn.classList.remove('capturing');
    btn.classList.add('done');
    btn.innerHTML = '✅&nbsp;&nbsp;Saved!';
    btn.disabled  = false;

    setTimeout(() => {
      btn.classList.remove('done');
      btn.innerHTML = '📋&nbsp;&nbsp;TAKE TRANSCRIPT';
      isTaking = false;
    }, 1000);
  }, WAIT_MS);
}

// ═══════════════════════════════════════════════════
//  STOP
// ═══════════════════════════════════════════════════
function stopRec() {
  isRecording = false;

  clearTimeout(sessionTimer);
  clearInterval(elapsedTimer);
  clearInterval(liveTimer);

  try { recognition?.stop(); } catch(e) {}
  try { mediaStream?.getTracks().forEach(t => t.stop()); } catch(e) {}
  try { silentCtx?.close(); } catch(e) {}

  document.getElementById('uiRec').style.display      = 'none';
  document.getElementById('uiIdle').style.display     = 'block';
  document.getElementById('liveSection').style.display = 'none';

  chunks         = [];
  currentInterim = '';
}

// ─── Add transcript card ───────────────────────────
function addCard(text) {
  const noSpeech = !text || text.startsWith('(no speech');
  const now      = new Date();
  const ts       = now.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

  const list = document.getElementById('cardList');
  const empty = list.querySelector('.empty-msg');
  if (empty) empty.remove();

  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="card-head">
      <span class="card-time">${ts}</span>
      <span class="card-badge">5s</span>
    </div>
    <div class="card-body ${noSpeech ? 'no-speech' : ''}">${text}</div>
  `;
  list.prepend(card);

  document.getElementById('clearBtn').style.display = 'block';
}

// ─── Clear all cards ───────────────────────────────
function clearAll() {
  document.getElementById('cardList').innerHTML =
    '<p class="empty-msg">Press ▶ Start Recording<br>then 📋 Take Transcript<br>to save what you said</p>';
  document.getElementById('clearBtn').style.display = 'none';
}
</script>
</body>
</html>

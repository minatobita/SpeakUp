<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>SpeakUp</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0d0d1a;
      min-height: 100vh;
      color: white;
      display: flex;
      flex-direction: column;
    }

    .top-bar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: #0d0d1a;
      padding: env(safe-area-inset-top, 14px) 16px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }

    .app-title {
      text-align: center;
      font-size: 11px;
      color: rgba(255,255,255,0.28);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    /* ── IDLE ── */
    .start-btn {
      width: 100%;
      height: 80px;
      border-radius: 22px;
      border: none;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: white;
      font-size: 19px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      box-shadow: 0 6px 24px rgba(34,197,94,0.4);
      touch-action: manipulation;
      transition: transform 0.15s;
    }
    .start-btn:active { transform: scale(0.97); }

    /* ── RECORDING UI ── */
    #uiRec { display: none; flex-direction: column; gap: 10px; }

    .rec-status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .rec-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #e94560;
      animation: blink 1s ease-in-out infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.1} }
    .rec-time {
      font-size: 14px;
      font-weight: 600;
      color: rgba(255,255,255,0.55);
      font-variant-numeric: tabular-nums;
      letter-spacing: 1px;
    }
    .bg-badge {
      font-size: 10px;
      background: rgba(34,197,94,0.15);
      color: #22c55e;
      padding: 2px 8px;
      border-radius: 8px;
      margin-left: 4px;
    }

    /* ── TAKE TRANSCRIPT (main) ── */
    .take-btn {
      width: 100%;
      height: 86px;
      border-radius: 22px;
      border: none;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      color: white;
      font-size: 20px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 6px 28px rgba(99,102,241,0.5);
      touch-action: manipulation;
      transition: transform 0.12s, background 0.2s;
      animation: pulseBlue 2s ease-in-out infinite alternate;
      letter-spacing: 0.5px;
    }
    @keyframes pulseBlue {
      from { box-shadow: 0 6px 20px rgba(99,102,241,0.4); }
      to   { box-shadow: 0 6px 38px rgba(99,102,241,0.75); }
    }
    .take-btn:active { transform: scale(0.96); }
    .take-btn.flash {
      background: linear-gradient(135deg, #22c55e, #16a34a) !important;
      animation: none;
    }

    /* ── STOP (secondary) ── */
    .stop-btn {
      width: 100%;
      height: 50px;
      border-radius: 14px;
      border: 1.5px solid rgba(233,69,96,0.45);
      background: rgba(233,69,96,0.1);
      color: rgba(233,69,96,0.85);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      touch-action: manipulation;
      transition: transform 0.12s, background 0.15s;
    }
    .stop-btn:active { transform: scale(0.96); background: rgba(233,69,96,0.22); }

    .lock-tip {
      margin-top: 2px;
      background: rgba(99,102,241,0.08);
      border: 1px solid rgba(99,102,241,0.2);
      border-radius: 12px;
      padding: 9px 14px;
      font-size: 12px;
      color: rgba(255,255,255,0.5);
      line-height: 1.7;
      text-align: center;
    }
    .lock-tip strong { color: #818cf8; }

    /* ── LIVE BOX ── */
    .live-section {
      padding: 12px 16px 0;
      display: none;
    }
    .live-label {
      font-size: 10px;
      color: rgba(255,255,255,0.3);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .live-box {
      padding: 12px 14px;
      background: rgba(255,255,255,0.04);
      border-radius: 14px;
      font-size: 14px;
      color: rgba(255,255,255,0.35);
      font-style: italic;
      min-height: 52px;
      word-break: break-word;
      line-height: 1.65;
      border: 1px solid rgba(255,255,255,0.06);
      transition: color 0.2s;
    }
    .live-box.has-text {
      color: rgba(255,255,255,0.88);
      font-style: normal;
    }

    /* ── ALERT ── */
    .alert {
      margin: 10px 16px 0;
      background: rgba(233,69,96,0.1);
      border: 1px solid rgba(233,69,96,0.3);
      border-radius: 12px;
      padding: 11px 14px;
      font-size: 13px;
      color: rgba(255,255,255,0.82);
      line-height: 1.7;
      display: none;
    }

    /* ── TRANSCRIPTS ── */
    .transcripts-section {
      flex: 1;
      padding: 14px 16px 80px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .tx-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .tx-title {
      font-size: 11px;
      font-weight: 600;
      color: rgba(255,255,255,0.3);
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .clear-btn {
      display: none;
      background: none;
      border: 1px solid rgba(233,69,96,0.4);
      color: rgba(233,69,96,0.75);
      font-size: 12px;
      padding: 4px 12px;
      border-radius: 20px;
      cursor: pointer;
      touch-action: manipulation;
    }
    .empty-msg {
      text-align: center;
      font-size: 14px;
      color: rgba(255,255,255,0.18);
      margin-top: 32px;
      line-height: 2.5;
    }

    .card {
      background: rgba(255,255,255,0.06);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 10px;
      animation: slideUp 0.3s ease;
    }
    @keyframes slideUp {
      from { opacity:0; transform:translateY(6px); }
      to   { opacity:1; transform:translateY(0); }
    }
    .card-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    .card-time { font-size: 12px; color: rgba(255,255,255,0.3); flex: 1; }
    .card-badge {
      font-size: 11px;
      background: rgba(99,102,241,0.2);
      color: #818cf8;
      padding: 2px 9px;
      border-radius: 9px;
    }
    .card-body {
      font-size: 15px;
      line-height: 1.65;
      color: white;
      word-break: break-word;
    }
    .card-body.no-speech {
      color: rgba(255,255,255,0.27);
      font-style: italic;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <p class="app-title">🎙️ SpeakUp</p>

    <div id="uiIdle">
      <button class="start-btn" onclick="startRecording()">
        <span>▶</span><span>Start Recording</span>
      </button>
    </div>

    <div id="uiRec">
      <div class="rec-status">
        <div class="rec-dot"></div>
        <span class="rec-time" id="recTime">00:00:00</span>
        <span class="bg-badge">● BG Active</span>
      </div>

      <button class="take-btn" id="takeBtn" onclick="takeTranscript()">
        📋&nbsp;&nbsp;TAKE TRANSCRIPT
      </button>

      <button class="stop-btn" onclick="stopRecording()">
        ⏹&nbsp;&nbsp;STOP
      </button>

      <div class="lock-tip">
        <strong>Lock screen:</strong> tap <strong>⏭ Next</strong> in media controls = Take Transcript
      </div>
    </div>
  </div>

  <div class="live-section" id="liveSection">
    <p class="live-label">🟢 Live · last 5 seconds</p>
    <div class="live-box" id="liveBox">Listening…</div>
  </div>

  <div class="alert" id="alertBox"></div>

  <div class="transcripts-section">
    <div class="tx-header">
      <span class="tx-title">Transcripts</span>
      <button class="clear-btn" id="clearBtn" onclick="clearAll()">Clear All</button>
    </div>
    <div id="cardList">
      <p class="empty-msg">Press ▶ Start Recording<br>then speak freely<br>tap 📋 to capture the last 5s</p>
    </div>
  </div>

<script>
// ─────────────────────────────────────────────
//  THE ONLY DATA STORE
//  phrases: [{text: string, time: number}]  ← final results only
//  interim: string                          ← current unfinished speech
//  interimTime: number                      ← when interim arrived
// ─────────────────────────────────────────────
let phrases    = [];
let interim    = '';
let interimTime = 0;

const WINDOW_MS = 5000;  // 5 seconds

// ─────────────────────────────────────────────
//  THE ONLY FUNCTION THAT READS/TRIMS DATA
// ─────────────────────────────────────────────
function getLast5s() {
  const cutoff = Date.now() - WINDOW_MS;

  // Permanently remove anything older than 5s
  phrases = phrases.filter(p => p.time >= cutoff);

  // Build text from remaining phrases
  const parts = phrases.map(p => p.text);

  // Add interim only if it arrived within 5s
  if (interim && interimTime >= cutoff) {
    parts.push(interim);
  }

  return parts.join(' ').trim();
}

// ─────────────────────────────────────────────
//  RECOGNITION
// ─────────────────────────────────────────────
let recognition   = null;
let isRecording   = false;
let restartTimer  = null;

function createRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return null;

  const r = new SR();
  r.lang = 'en-US';
  r.continuous = false;       // iOS compatible
  r.interimResults = true;
  r.maxAlternatives = 1;

  r.onresult = (e) => {
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const text = e.results[i][0].transcript.trim();
      if (!text) continue;

      if (e.results[i].isFinal) {
        // Final result → push with current timestamp
        phrases.push({ text, time: Date.now() });
        interim = '';
        interimTime = 0;
      } else {
        // Interim result → overwrite
        interim = text;
        interimTime = Date.now();
      }
    }
  };

  r.onend = () => {
    // Clear any dangling interim when session ends
    interim = '';
    // Restart immediately if still recording
    if (isRecording) {
      restartTimer = setTimeout(startSession, 150);
    }
  };

  r.onerror = (e) => {
    if (e.error === 'no-speech' || e.error === 'aborted') return;
    showAlert('Speech error: ' + e.error + '. Retrying…');
  };

  return r;
}

function startSession() {
  if (!isRecording) return;
  clearTimeout(restartTimer);
  try {
    recognition = createRecognition();
    if (recognition) recognition.start();
  } catch (err) {
    // already started — wait and retry
    restartTimer = setTimeout(startSession, 300);
  }
}

function stopSession() {
  clearTimeout(restartTimer);
  if (recognition) {
    try { recognition.abort(); } catch (e) {}
    recognition = null;
  }
}

// ─────────────────────────────────────────────
//  RECORDING CONTROL
// ─────────────────────────────────────────────
let clockTimer = null;
let liveTimer  = null;
let elapsed    = 0;

function startRecording() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    showAlert('⚠️ Speech Recognition is not supported. Please use Safari on iPhone.');
    return;
  }

  // Reset data
  phrases = [];
  interim = '';
  interimTime = 0;
  elapsed = 0;

  isRecording = true;
  document.getElementById('uiIdle').style.display = 'none';
  document.getElementById('uiRec').style.display  = 'flex';
  document.getElementById('liveSection').style.display = 'block';
  hideAlert();

  // Clock
  clockTimer = setInterval(() => {
    elapsed++;
    const h = String(Math.floor(elapsed / 3600)).padStart(2, '0');
    const m = String(Math.floor((elapsed % 3600) / 60)).padStart(2, '0');
    const s = String(elapsed % 60).padStart(2, '0');
    document.getElementById('recTime').textContent = `${h}:${m}:${s}`;
  }, 1000);

  // Live box — refresh every 150ms
  liveTimer = setInterval(updateLive, 150);

  // Background audio keep-alive
  startSilentAudio();

  // Lock screen media controls
  setupMediaSession();

  // Start speech recognition
  startSession();
}

function stopRecording() {
  isRecording = false;
  stopSession();
  clearInterval(clockTimer);
  clearInterval(liveTimer);
  stopSilentAudio();

  phrases = [];
  interim = '';
  interimTime = 0;

  document.getElementById('uiIdle').style.display = 'block';
  document.getElementById('uiRec').style.display  = 'none';
  document.getElementById('liveSection').style.display = 'none';
  document.getElementById('liveBox').textContent = 'Listening…';
  document.getElementById('liveBox').classList.remove('has-text');
}

// ─────────────────────────────────────────────
//  TAKE TRANSCRIPT  ← the key function
// ─────────────────────────────────────────────
function takeTranscript() {
  // 1. Snapshot exactly what getLast5s() returns RIGHT NOW
  const text = getLast5s();

  // 2. Save to card
  addCard(text);

  // 3. Clear data so next transcript starts fresh
  phrases     = [];
  interim     = '';
  interimTime = 0;

  // 4. Update live box immediately
  updateLive();

  // 5. Flash button green for confirmation
  const btn = document.getElementById('takeBtn');
  btn.classList.add('flash');
  setTimeout(() => btn.classList.remove('flash'), 600);
}

// ─────────────────────────────────────────────
//  LIVE BOX UPDATE
// ─────────────────────────────────────────────
function updateLive() {
  const text = getLast5s();
  const box  = document.getElementById('liveBox');
  if (text) {
    box.textContent = text;
    box.classList.add('has-text');
  } else {
    box.textContent = 'Listening…';
    box.classList.remove('has-text');
  }
}

// ─────────────────────────────────────────────
//  CARD MANAGEMENT
// ─────────────────────────────────────────────
let cardCount = 0;

function addCard(text) {
  cardCount++;
  const list = document.getElementById('cardList');

  // Remove empty message
  const empty = list.querySelector('.empty-msg');
  if (empty) empty.remove();

  const now = new Date();
  const ts  = now.toTimeString().slice(0, 8);

  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="card-head">
      <span class="card-time">${ts}</span>
      <span class="card-badge">#${cardCount}</span>
    </div>
    <div class="card-body ${!text ? 'no-speech' : ''}">
      ${text || '(no speech in last 5 seconds)'}
    </div>`;

  list.prepend(card);
  document.getElementById('clearBtn').style.display = 'block';
}

function clearAll() {
  const list = document.getElementById('cardList');
  list.innerHTML = '<p class="empty-msg">Press ▶ Start Recording<br>then speak freely<br>tap 📋 to capture the last 5s</p>';
  document.getElementById('clearBtn').style.display = 'none';
  cardCount = 0;
}

// ─────────────────────────────────────────────
//  BACKGROUND KEEP-ALIVE (silent audio)
// ─────────────────────────────────────────────
let audioCtx  = null;
let silentSrc = null;

function startSilentAudio() {
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const buf = audioCtx.createBuffer(1, audioCtx.sampleRate, audioCtx.sampleRate);
    silentSrc = audioCtx.createBufferSource();
    silentSrc.buffer = buf;
    silentSrc.loop = true;
    silentSrc.connect(audioCtx.destination);
    silentSrc.start();
  } catch (e) {}
}

function stopSilentAudio() {
  try {
    if (silentSrc) silentSrc.stop();
    if (audioCtx)  audioCtx.close();
  } catch (e) {}
  silentSrc = null;
  audioCtx  = null;
}

// ─────────────────────────────────────────────
//  LOCK SCREEN MEDIA SESSION
// ─────────────────────────────────────────────
function setupMediaSession() {
  if (!('mediaSession' in navigator)) return;
  navigator.mediaSession.metadata = new MediaMetadata({
    title: 'SpeakUp 🎤',
    artist: 'Recording in progress',
    album:  'Tap ⏭ Next = Take Transcript'
  });
  navigator.mediaSession.setActionHandler('nexttrack', () => {
    takeTranscript();
  });
  navigator.mediaSession.setActionHandler('previoustrack', () => {
    takeTranscript();
  });
}

// ─────────────────────────────────────────────
//  ALERT
// ─────────────────────────────────────────────
function showAlert(msg) {
  const el = document.getElementById('alertBox');
  el.textContent = msg;
  el.style.display = 'block';
}
function hideAlert() {
  document.getElementById('alertBox').style.display = 'none';
}
</script>
</body>
</html>

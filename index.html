<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>SpeakUp</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0d0d1a;
      min-height: 100vh;
      color: white;
      display: flex;
      flex-direction: column;
    }

    .top-bar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: #0d0d1a;
      padding: env(safe-area-inset-top, 14px) 16px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }

    .app-title {
      text-align: center;
      font-size: 11px;
      color: rgba(255,255,255,0.28);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    /* ── IDLE ── */
    .start-btn {
      width: 100%;
      height: 80px;
      border-radius: 22px;
      border: none;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: white;
      font-size: 19px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      box-shadow: 0 6px 24px rgba(34,197,94,0.4);
      touch-action: manipulation;
      transition: transform 0.15s;
    }
    .start-btn:active { transform: scale(0.97); }

    /* ── RECORDING UI ── */
    #uiRec { display: none; flex-direction: column; gap: 10px; }

    .rec-status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .rec-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #e94560;
      animation: blink 1s ease-in-out infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.1} }
    .rec-time {
      font-size: 14px;
      font-weight: 600;
      color: rgba(255,255,255,0.55);
      font-variant-numeric: tabular-nums;
      letter-spacing: 1px;
    }
    .bg-badge {
      font-size: 10px;
      background: rgba(34,197,94,0.15);
      color: #22c55e;
      padding: 2px 8px;
      border-radius: 8px;
      margin-left: 4px;
    }

    /* ── TAKE TRANSCRIPT (main) ── */
    .take-btn {
      width: 100%;
      height: 86px;
      border-radius: 22px;
      border: none;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      color: white;
      font-size: 20px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 6px 28px rgba(99,102,241,0.5);
      touch-action: manipulation;
      transition: transform 0.12s, background 0.2s;
      animation: pulseBlue 2s ease-in-out infinite alternate;
      letter-spacing: 0.5px;
    }
    @keyframes pulseBlue {
      from { box-shadow: 0 6px 20px rgba(99,102,241,0.4); }
      to   { box-shadow: 0 6px 38px rgba(99,102,241,0.75); }
    }
    .take-btn:active { transform: scale(0.96); }
    .take-btn.flash {
      background: linear-gradient(135deg, #22c55e, #16a34a) !important;
      animation: none;
    }

    /* ── STOP (secondary) ── */
    .stop-btn {
      width: 100%;
      height: 50px;
      border-radius: 14px;
      border: 1.5px solid rgba(233,69,96,0.45);
      background: rgba(233,69,96,0.1);
      color: rgba(233,69,96,0.85);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      touch-action: manipulation;
      transition: transform 0.12s, background 0.15s;
    }
    .stop-btn:active { transform: scale(0.96); background: rgba(233,69,96,0.22); }

    .lock-tip {
      margin-top: 2px;
      background: rgba(99,102,241,0.08);
      border: 1px solid rgba(99,102,241,0.2);
      border-radius: 12px;
      padding: 9px 14px;
      font-size: 12px;
      color: rgba(255,255,255,0.5);
      line-height: 1.7;
      text-align: center;
    }
    .lock-tip strong { color: #818cf8; }

    /* ── LIVE BOX ── */
    .live-section {
      padding: 12px 16px 0;
      display: none;
    }
    .live-label {
      font-size: 10px;
      color: rgba(255,255,255,0.3);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .live-box {
      padding: 12px 14px;
      background: rgba(255,255,255,0.04);
      border-radius: 14px;
      font-size: 14px;
      color: rgba(255,255,255,0.35);
      font-style: italic;
      min-height: 52px;
      word-break: break-word;
      line-height: 1.65;
      border: 1px solid rgba(255,255,255,0.06);
      transition: color 0.2s;
    }
    .live-box.has-text {
      color: rgba(255,255,255,0.88);
      font-style: normal;
    }

    /* ── ALERT ── */
    .alert {
      margin: 10px 16px 0;
      background: rgba(233,69,96,0.1);
      border: 1px solid rgba(233,69,96,0.3);
      border-radius: 12px;
      padding: 11px 14px;
      font-size: 13px;
      color: rgba(255,255,255,0.82);
      line-height: 1.7;
      display: none;
    }

    /* ── TRANSCRIPTS ── */
    .transcripts-section {
      flex: 1;
      padding: 14px 16px 80px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .tx-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .tx-title {
      font-size: 11px;
      font-weight: 600;
      color: rgba(255,255,255,0.3);
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .clear-btn {
      display: none;
      background: none;
      border: 1px solid rgba(233,69,96,0.4);
      color: rgba(233,69,96,0.75);
      font-size: 12px;
      padding: 4px 12px;
      border-radius: 20px;
      cursor: pointer;
      touch-action: manipulation;
    }
    .empty-msg {
      text-align: center;
      font-size: 14px;
      color: rgba(255,255,255,0.18);
      margin-top: 32px;
      line-height: 2.5;
    }

    .card {
      background: rgba(255,255,255,0.06);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 10px;
      animation: slideUp 0.3s ease;
    }
    @keyframes slideUp {
      from { opacity:0; transform:translateY(6px); }
      to   { opacity:1; transform:translateY(0); }
    }
    .card-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    .card-time { font-size: 12px; color: rgba(255,255,255,0.3); flex: 1; }
    .card-badge {
      font-size: 11px;
      background: rgba(99,102,241,0.2);
      color: #818cf8;
      padding: 2px 9px;
      border-radius: 9px;
    }
    .card-body {
      font-size: 15px;
      line-height: 1.65;
      color: white;
      word-break: break-word;
    }
    .card-body.no-speech {
      color: rgba(255,255,255,0.27);
      font-style: italic;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <p class="app-title">🎙️ SpeakUp</p>

    <div id="uiIdle">
      <button class="start-btn" onclick="startRecording()">
        <span>▶</span><span>Start Recording</span>
      </button>
    </div>

    <div id="uiRec">
      <div class="rec-status">
        <div class="rec-dot"></div>
        <span class="rec-time" id="recTime">00:00:00</span>
        <span class="bg-badge">● BG Active</span>
      </div>

      <button class="take-btn" id="takeBtn" onclick="takeTranscript()">
        📋&nbsp;&nbsp;TAKE TRANSCRIPT
      </button>

      <button class="stop-btn" onclick="stopRecording()">
        ⏹&nbsp;&nbsp;STOP
      </button>

      <div class="lock-tip">
        <strong>Lock screen:</strong> tap <strong>⏭ Next</strong> in media controls = Take Transcript
      </div>
    </div>
  </div>

  <div class="live-section" id="liveSection">
    <p class="live-label">⬤ Live · last 5 seconds</p>
    <div class="live-box" id="liveBox">Listening…</div>
  </div>

  <div class="alert" id="alertBox"></div>

  <div class="transcripts-section">
    <div class="tx-header">
      <span class="tx-title">Transcripts</span>
      <button class="clear-btn" id="clearBtn" onclick="clearAll()">Clear All</button>
    </div>
    <div id="cardList">
      <p class="empty-msg">No transcripts yet<br>Press Start → speak → Take Transcript</p>
    </div>
  </div>

<script>
// ─────────────────────────────────────────────
//  STATE  — single source of truth
// ─────────────────────────────────────────────
const WINDOW_MS = 5000; // 5‑second rolling window

let wordLog      = [];  // [{text, time}]  finalized phrases only
let interimText  = '';  // current in-progress interim (not yet final)
let isRecording  = false;
let recSeconds   = 0;
let recTimer     = null;
let liveTimer    = null;
let recognition  = null;
let silentAudio  = null;
let audioCtx     = null;

// ─────────────────────────────────────────────
//  CORE: single function that returns last 5 s
//  AND trims wordLog in place (destructive)
// ─────────────────────────────────────────────
function getLast5s() {
  const cutoff = Date.now() - WINDOW_MS;
  wordLog = wordLog.filter(e => e.time >= cutoff); // trim old entries
  const finalPart = wordLog.map(e => e.text).join(' ').trim();
  return finalPart
    ? (interimText ? finalPart + ' ' + interimText : finalPart)
    : interimText.trim();
}

// ─────────────────────────────────────────────
//  LIVE BOX  — called every 100 ms
// ─────────────────────────────────────────────
function updateLive() {
  const text = getLast5s(); // also trims wordLog
  const box  = document.getElementById('liveBox');
  if (text) {
    box.textContent = text;
    box.classList.add('has-text');
  } else {
    box.textContent = '🎤 Listening…';
    box.classList.remove('has-text');
  }
}

// ─────────────────────────────────────────────
//  SPEECH RECOGNITION  (iOS‑safe loop)
// ─────────────────────────────────────────────
function buildRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return null;

  const r = new SR();
  r.lang              = 'en-US';
  r.continuous        = false; // iOS requires false
  r.interimResults    = true;
  r.maxAlternatives   = 1;

  r.onresult = (e) => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) {
        // push finalized phrase with current timestamp
        if (t.trim()) {
          wordLog.push({ text: t.trim(), time: Date.now() });
        }
        interim = '';
      } else {
        interim += t;
      }
    }
    interimText = interim;
  };

  r.onend = () => {
    interimText = ''; // clear interim on session end
    if (isRecording) {
      // restart immediately (iOS loop)
      setTimeout(() => {
        if (isRecording) {
          try { recognition.start(); } catch(_) {}
        }
      }, 120);
    }
  };

  r.onerror = (e) => {
    if (e.error === 'no-speech' || e.error === 'audio-capture') return;
    if (e.error === 'not-allowed') {
      showAlert('Microphone permission denied. Please allow mic access in Safari Settings.');
      stopRecording();
    }
  };

  return r;
}

// ─────────────────────────────────────────────
//  START
// ─────────────────────────────────────────────
async function startRecording() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    showAlert('Speech Recognition is not supported. Please use Safari on iPhone.');
    return;
  }

  // Request mic first (unlocks iOS audio context)
  try {
    await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch(err) {
    showAlert('Cannot access microphone. Please allow mic in Safari Settings → SpeakUp.');
    return;
  }

  // Reset state completely
  wordLog     = [];
  interimText = '';
  isRecording = true;
  recSeconds  = 0;

  // Build & start recognition
  recognition = buildRecognition();
  try { recognition.start(); } catch(_) {}

  // Background keep-alive (silent audio)
  startSilentAudio();

  // Lock-screen media session
  setupMediaSession();

  // UI
  document.getElementById('uiIdle').style.display = 'none';
  document.getElementById('uiRec').style.display  = 'flex';
  document.getElementById('liveSection').style.display = 'block';

  // Timers
  recTimer  = setInterval(tickClock, 1000);
  liveTimer = setInterval(updateLive, 100);
}

// ─────────────────────────────────────────────
//  STOP
// ─────────────────────────────────────────────
function stopRecording() {
  isRecording = false;

  try { recognition && recognition.stop(); } catch(_) {}
  recognition = null;

  clearInterval(recTimer);
  clearInterval(liveTimer);
  stopSilentAudio();

  wordLog     = [];
  interimText = '';

  document.getElementById('uiIdle').style.display = 'block';
  document.getElementById('uiRec').style.display  = 'none';
  document.getElementById('liveSection').style.display = 'none';

  const box = document.getElementById('liveBox');
  box.textContent = 'Listening…';
  box.classList.remove('has-text');
}

// ─────────────────────────────────────────────
//  TAKE TRANSCRIPT  ← main action
// ─────────────────────────────────────────────
function takeTranscript() {
  const text = getLast5s(); // get current 5-second window

  // Flash button
  const btn = document.getElementById('takeBtn');
  btn.classList.add('flash');
  setTimeout(() => btn.classList.remove('flash'), 400);

  // Save card
  addCard(text || '');

  // ★ KEY FIX: clear both wordLog and interimText after saving
  wordLog     = [];
  interimText = '';

  // Reset liveBox immediately
  const box = document.getElementById('liveBox');
  box.textContent = '🎤 Listening…';
  box.classList.remove('has-text');
}

// ─────────────────────────────────────────────
//  CARD
// ─────────────────────────────────────────────
function addCard(text) {
  const list = document.getElementById('cardList');

  // Remove empty message
  const empty = list.querySelector('.empty-msg');
  if (empty) empty.remove();

  const now = new Date();
  const ts  = now.toTimeString().slice(0,8);

  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="card-head">
      <span class="card-time">${ts}</span>
      <span class="card-badge">5 s</span>
    </div>
    <div class="card-body${text ? '' : ' no-speech'}">
      ${text || '(No speech detected in the last 5 seconds)'}
    </div>`;

  list.prepend(card);
  document.getElementById('clearBtn').style.display = 'block';
}

// ─────────────────────────────────────────────
//  CLEAR ALL
// ─────────────────────────────────────────────
function clearAll() {
  const list = document.getElementById('cardList');
  list.innerHTML = '<p class="empty-msg">No transcripts yet<br>Press Start → speak → Take Transcript</p>';
  document.getElementById('clearBtn').style.display = 'none';
}

// ─────────────────────────────────────────────
//  CLOCK
// ─────────────────────────────────────────────
function tickClock() {
  recSeconds++;
  const h = String(Math.floor(recSeconds / 3600)).padStart(2,'0');
  const m = String(Math.floor((recSeconds % 3600) / 60)).padStart(2,'0');
  const s = String(recSeconds % 60).padStart(2,'0');
  document.getElementById('recTime').textContent = `${h}:${m}:${s}`;
}

// ─────────────────────────────────────────────
//  SILENT AUDIO  (keeps iOS tab alive)
// ─────────────────────────────────────────────
function startSilentAudio() {
  try {
    audioCtx   = new (window.AudioContext || window.webkitAudioContext)();
    const buf  = audioCtx.createBuffer(1, audioCtx.sampleRate * 2, audioCtx.sampleRate);
    const src  = audioCtx.createBufferSource();
    src.buffer = buf;
    src.loop   = true;
    src.connect(audioCtx.destination);
    src.start();
    silentAudio = src;
  } catch(_) {}
}

function stopSilentAudio() {
  try { silentAudio && silentAudio.stop(); } catch(_) {}
  try { audioCtx    && audioCtx.close();   } catch(_) {}
  silentAudio = null;
  audioCtx    = null;
}

// ─────────────────────────────────────────────
//  MEDIA SESSION  (lock screen ⏭ = Take Transcript)
// ─────────────────────────────────────────────
function setupMediaSession() {
  if (!('mediaSession' in navigator)) return;
  navigator.mediaSession.metadata = new MediaMetadata({
    title:  'SpeakUp 🎤',
    artist: 'Recording in progress',
    album:  'Press ⏭ Next = Take Transcript',
  });
  navigator.mediaSession.setActionHandler('nexttrack', takeTranscript);
  navigator.mediaSession.setActionHandler('previoustrack', takeTranscript);
}

// ─────────────────────────────────────────────
//  ALERT
// ─────────────────────────────────────────────
function showAlert(msg) {
  const el = document.getElementById('alertBox');
  el.textContent = msg;
  el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 6000);
}
</script>
</body>
</html>

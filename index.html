<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>SpeakUp</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0d0d1a;
      min-height: 100vh;
      color: white;
      display: flex;
      flex-direction: column;
    }

    .top-bar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: #0d0d1a;
      padding: env(safe-area-inset-top, 14px) 16px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }

    .app-title {
      text-align: center;
      font-size: 11px;
      color: rgba(255,255,255,0.28);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    /* START BUTTON */
    .start-btn {
      width: 100%;
      height: 80px;
      border-radius: 22px;
      border: none;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: white;
      font-size: 19px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      box-shadow: 0 6px 24px rgba(34,197,94,0.4);
      touch-action: manipulation;
      transition: transform 0.15s;
    }
    .start-btn:active { transform: scale(0.97); }

    /* RECORDING UI */
    #uiRec { display: none; flex-direction: column; gap: 10px; }

    .rec-status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .rec-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #e94560;
      animation: blink 1s ease-in-out infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.1} }
    .rec-time {
      font-size: 14px;
      font-weight: 600;
      color: rgba(255,255,255,0.55);
      font-variant-numeric: tabular-nums;
      letter-spacing: 1px;
    }
    .bg-badge {
      font-size: 10px;
      background: rgba(34,197,94,0.15);
      color: #22c55e;
      padding: 2px 8px;
      border-radius: 8px;
      margin-left: 4px;
    }

    /* TAKE TRANSCRIPT BUTTON – PRIMARY */
    .take-btn {
      width: 100%;
      height: 86px;
      border-radius: 22px;
      border: none;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      color: white;
      font-size: 20px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 6px 28px rgba(99,102,241,0.5);
      touch-action: manipulation;
      transition: transform 0.12s, background 0.2s;
      animation: pulseBlue 2s ease-in-out infinite alternate;
      letter-spacing: 0.5px;
    }
    @keyframes pulseBlue {
      from { box-shadow: 0 6px 20px rgba(99,102,241,0.4); }
      to   { box-shadow: 0 6px 38px rgba(99,102,241,0.75); }
    }
    .take-btn:active { transform: scale(0.96); }
    .take-btn.flash {
      background: linear-gradient(135deg, #22c55e, #16a34a) !important;
      animation: none;
    }

    /* STOP BUTTON – SECONDARY */
    .stop-btn {
      width: 100%;
      height: 50px;
      border-radius: 14px;
      border: 1.5px solid rgba(233,69,96,0.45);
      background: rgba(233,69,96,0.1);
      color: rgba(233,69,96,0.85);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      touch-action: manipulation;
      transition: transform 0.12s, background 0.15s;
    }
    .stop-btn:active { transform: scale(0.96); background: rgba(233,69,96,0.22); }

    /* LOCK SCREEN TIP */
    .lock-tip {
      margin-top: 2px;
      background: rgba(99,102,241,0.08);
      border: 1px solid rgba(99,102,241,0.2);
      border-radius: 12px;
      padding: 9px 14px;
      font-size: 12px;
      color: rgba(255,255,255,0.5);
      line-height: 1.7;
      text-align: center;
    }
    .lock-tip strong { color: #818cf8; }

    /* LIVE BOX */
    .live-section {
      padding: 12px 16px 0;
      display: none;
    }
    .live-label {
      font-size: 10px;
      color: rgba(255,255,255,0.3);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .live-box {
      padding: 12px 14px;
      background: rgba(255,255,255,0.04);
      border-radius: 14px;
      font-size: 14px;
      color: rgba(255,255,255,0.35);
      font-style: italic;
      min-height: 52px;
      word-break: break-word;
      line-height: 1.65;
      border: 1px solid rgba(255,255,255,0.06);
      transition: color 0.2s;
    }
    .live-box.has-text {
      color: rgba(255,255,255,0.88);
      font-style: normal;
    }

    /* ALERT */
    .alert {
      margin: 10px 16px 0;
      background: rgba(233,69,96,0.1);
      border: 1px solid rgba(233,69,96,0.3);
      border-radius: 12px;
      padding: 11px 14px;
      font-size: 13px;
      color: rgba(255,255,255,0.82);
      line-height: 1.7;
      display: none;
    }

    /* TRANSCRIPTS */
    .transcripts-section {
      flex: 1;
      padding: 14px 16px 80px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .tx-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .tx-title {
      font-size: 11px;
      font-weight: 600;
      color: rgba(255,255,255,0.3);
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .clear-btn {
      display: none;
      background: none;
      border: 1px solid rgba(233,69,96,0.4);
      color: rgba(233,69,96,0.75);
      font-size: 12px;
      padding: 4px 12px;
      border-radius: 20px;
      cursor: pointer;
      touch-action: manipulation;
    }
    .empty-msg {
      text-align: center;
      font-size: 14px;
      color: rgba(255,255,255,0.18);
      margin-top: 32px;
      line-height: 2.5;
    }

    /* CARD */
    .card {
      background: rgba(255,255,255,0.06);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 10px;
      animation: slideUp 0.3s ease;
    }
    @keyframes slideUp {
      from { opacity:0; transform:translateY(6px); }
      to   { opacity:1; transform:translateY(0); }
    }
    .card-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    .card-time { font-size: 12px; color: rgba(255,255,255,0.3); flex: 1; }
    .card-badge {
      font-size: 11px;
      background: rgba(99,102,241,0.2);
      color: #818cf8;
      padding: 2px 9px;
      border-radius: 9px;
    }
    .card-body {
      font-size: 15px;
      line-height: 1.65;
      color: white;
      word-break: break-word;
    }
    .card-body.no-speech {
      color: rgba(255,255,255,0.27);
      font-style: italic;
    }
  </style>
</head>
<body>

  <!-- TOP BAR -->
  <div class="top-bar">
    <p class="app-title">🎙️ SpeakUp</p>

    <!-- IDLE -->
    <div id="uiIdle">
      <button class="start-btn" onclick="startRecording()">
        <span>▶</span><span>Start Recording</span>
      </button>
    </div>

    <!-- RECORDING -->
    <div id="uiRec">
      <div class="rec-status">
        <div class="rec-dot"></div>
        <span class="rec-time" id="recTime">00:00:00</span>
        <span class="bg-badge">● BG Active</span>
      </div>

      <!-- PRIMARY: Take Transcript -->
      <button class="take-btn" id="takeBtn" onclick="takeTranscript()">
        📋&nbsp;&nbsp;TAKE TRANSCRIPT
      </button>

      <!-- SECONDARY: Stop -->
      <button class="stop-btn" onclick="stopRecording()">
        ⏹&nbsp;&nbsp;STOP
      </button>

      <div class="lock-tip">
        📱 Lock screen: tap <strong>⏭ next</strong> in media controls<br>
        🎧 Earphones: press center button <strong>twice</strong>
      </div>
    </div>
  </div>

  <!-- ALERT -->
  <div class="alert" id="alertBox"></div>

  <!-- LIVE BOX -->
  <div class="live-section" id="liveSection">
    <p class="live-label">● Live · last 5 seconds</p>
    <div class="live-box" id="liveBox">🎤 Listening…</div>
  </div>

  <!-- TRANSCRIPTS -->
  <div class="transcripts-section">
    <div class="tx-header">
      <span class="tx-title">Transcripts</span>
      <button class="clear-btn" id="clearBtn" onclick="clearAll()">Clear All</button>
    </div>
    <div id="cardList">
      <div class="empty-msg" id="emptyMsg">
        Press ▶ to start recording<br>
        then tap <strong style="color:#818cf8">📋 Take Transcript</strong><br>
        to save what you said
      </div>
    </div>
  </div>

<script>
// ═══════════════════════════════════════════════════════
// THE SINGLE SOURCE OF TRUTH
// wordLog is the ONLY place speech data is stored.
// Both liveBox and takeTranscript read from getLast5s().
// If liveBox shows text → takeTranscript will too. Always.
// ═══════════════════════════════════════════════════════

let wordLog = [];        // [{text: string, endTime: number}]
let isRecording = false;
let recog = null;
let silentCtx = null;
let silentSrc = null;
let timerRef = null;
let liveRef = null;
let startEpoch = 0;

// ─── GET LAST 5 SECONDS ─────────────────────────────
// This is the ONE function used by BOTH liveBox and takeTranscript.
function getLast5s() {
  const cutoff = Date.now() - 5000;
  return wordLog
    .filter(w => w.endTime >= cutoff)
    .map(w => w.text)
    .join(' ')
    .trim();
}

// ─── START ──────────────────────────────────────────
function startRecording() {
  if (isRecording) return;

  // Unlock microphone first via getUserMedia
  navigator.mediaDevices.getUserMedia({ audio: true })
    .then(() => {
      isRecording = true;
      wordLog = [];
      startEpoch = Date.now();

      startSilentAudio();
      setupMediaSession();
      startRecognitionLoop();

      // Timer
      timerRef = setInterval(() => {
        const s = Math.floor((Date.now() - startEpoch) / 1000);
        const h = String(Math.floor(s / 3600)).padStart(2,'0');
        const m = String(Math.floor((s % 3600) / 60)).padStart(2,'0');
        const sc = String(s % 60).padStart(2,'0');
        document.getElementById('recTime').textContent = h+':'+m+':'+sc;
      }, 1000);

      // Live box: reads from getLast5s() every 300ms
      liveRef = setInterval(() => {
        const text = getLast5s();
        const box = document.getElementById('liveBox');
        if (text) {
          box.textContent = text;
          box.classList.add('has-text');
        } else {
          box.textContent = '🎤 Listening…';
          box.classList.remove('has-text');
        }
      }, 300);

      document.getElementById('uiIdle').style.display = 'none';
      document.getElementById('uiRec').style.display = 'flex';
      document.getElementById('liveSection').style.display = 'block';
      showAlert('');
    })
    .catch(() => {
      showAlert('⚠️ Microphone access denied. Go to Safari Settings → SpeakUp → Allow Microphone.');
    });
}

// ─── TAKE TRANSCRIPT ────────────────────────────────
// Reads from getLast5s() — exact same function as liveBox.
// If liveBox shows text, this will ALWAYS find it.
function takeTranscript() {
  const text = getLast5s();

  // Add card
  addCard(text);

  // Flash button green for feedback
  const btn = document.getElementById('takeBtn');
  btn.classList.add('flash');
  setTimeout(() => btn.classList.remove('flash'), 700);
}

// ─── STOP ────────────────────────────────────────────
function stopRecording() {
  isRecording = false;
  clearInterval(timerRef);
  clearInterval(liveRef);

  if (recog) {
    try { recog.stop(); } catch(e) {}
    recog = null;
  }

  stopSilentAudio();

  document.getElementById('uiIdle').style.display = 'block';
  document.getElementById('uiRec').style.display = 'none';
  document.getElementById('liveSection').style.display = 'none';

  const box = document.getElementById('liveBox');
  box.textContent = '🎤 Listening…';
  box.classList.remove('has-text');
}

// ─── SPEECH RECOGNITION LOOP ────────────────────────
// iOS Safari doesn't support continuous=true.
// So we use continuous=false and restart on onend.
function startRecognitionLoop() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    showAlert('⚠️ Speech recognition not supported. Please use Safari on iPhone.');
    return;
  }

  function createAndStart() {
    if (!isRecording) return;

    const r = new SR();
    r.lang = 'en-US';
    r.continuous = false;       // iOS requires false
    r.interimResults = false;   // final results only → precise endTime

    r.onresult = function(e) {
      for (let i = e.resultIndex; i < e.results.length; i++) {
        if (e.results[i].isFinal) {
          const text = e.results[i][0].transcript.trim();
          if (text) {
            // ★ Store with exact timestamp when this phrase ended
            wordLog.push({ text: text, endTime: Date.now() });
          }
        }
      }
    };

    r.onerror = function(e) {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        showAlert('⚠️ Microphone blocked. Allow microphone in Safari Settings.');
        stopRecording();
      }
      // Other errors (network, no-speech): just restart
    };

    r.onend = function() {
      // Restart immediately if still recording
      if (isRecording) {
        setTimeout(createAndStart, 150);
      }
    };

    try {
      r.start();
      recog = r;
    } catch(e) {
      if (isRecording) setTimeout(createAndStart, 300);
    }
  }

  createAndStart();
}

// ─── SILENT AUDIO (keeps Safari alive in background) ─
function startSilentAudio() {
  try {
    silentCtx = new (window.AudioContext || window.webkitAudioContext)();
    const buf = silentCtx.createBuffer(1, silentCtx.sampleRate * 3, silentCtx.sampleRate);
    const src = silentCtx.createBufferSource();
    src.buffer = buf;
    src.loop = true;
    src.connect(silentCtx.destination);
    src.start();
    silentSrc = src;
  } catch(e) {}
}

function stopSilentAudio() {
  try {
    if (silentSrc) silentSrc.stop();
    if (silentCtx) silentCtx.close();
  } catch(e) {}
  silentSrc = null;
  silentCtx = null;
}

// ─── MEDIA SESSION (lock screen ⏭ button) ───────────
function setupMediaSession() {
  if (!('mediaSession' in navigator)) return;
  try {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: 'SpeakUp 🎤',
      artist: 'Recording in progress…',
      album: 'Tap ⏭ to Take Transcript'
    });
    navigator.mediaSession.setActionHandler('nexttrack', () => {
      takeTranscript();
    });
    navigator.mediaSession.setActionHandler('previoustrack', () => {
      takeTranscript();
    });
  } catch(e) {}
}

// ─── ADD CARD ─────────────────────────────────────────
function addCard(text) {
  document.getElementById('emptyMsg').style.display = 'none';
  document.getElementById('clearBtn').style.display = 'block';

  const now = new Date();
  const time = now.toTimeString().slice(0,8);

  const card = document.createElement('div');
  card.className = 'card';

  const noSpeech = !text;

  card.innerHTML = `
    <div class="card-head">
      <span class="card-time">${time}</span>
      <span class="card-badge">last 5s</span>
    </div>
    <div class="card-body ${noSpeech ? 'no-speech' : ''}">
      ${noSpeech ? '(no speech in the last 5 seconds)' : escHtml(text)}
    </div>
  `;

  const list = document.getElementById('cardList');
  list.insertBefore(card, list.firstChild);
}

// ─── CLEAR ALL ────────────────────────────────────────
function clearAll() {
  document.getElementById('cardList').innerHTML =
    '<div class="empty-msg" id="emptyMsg">' +
    'Press ▶ to start recording<br>' +
    'then tap <strong style="color:#818cf8">📋 Take Transcript</strong><br>' +
    'to save what you said</div>';
  document.getElementById('clearBtn').style.display = 'none';
}

// ─── ALERT ────────────────────────────────────────────
function showAlert(msg) {
  const el = document.getElementById('alertBox');
  if (msg) {
    el.textContent = msg;
    el.style.display = 'block';
  } else {
    el.style.display = 'none';
  }
}

// ─── UTILS ────────────────────────────────────────────
function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>SpeakUp</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0d0d1a;
      min-height: 100vh;
      color: white;
      display: flex;
      flex-direction: column;
    }

    .top-bar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: #0d0d1a;
      padding: env(safe-area-inset-top, 14px) 16px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }

    .app-title {
      text-align: center;
      font-size: 11px;
      color: rgba(255,255,255,0.28);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .start-btn {
      width: 100%;
      height: 80px;
      border-radius: 22px;
      border: none;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: white;
      font-size: 19px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      box-shadow: 0 6px 24px rgba(34,197,94,0.4);
      touch-action: manipulation;
      transition: transform 0.15s;
    }
    .start-btn:active { transform: scale(0.97); }

    #uiRec { display: none; flex-direction: column; gap: 10px; }

    .rec-status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .rec-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #e94560;
      animation: blink 1s ease-in-out infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.1} }
    .rec-time {
      font-size: 14px;
      font-weight: 600;
      color: rgba(255,255,255,0.55);
      font-variant-numeric: tabular-nums;
      letter-spacing: 1px;
    }
    .bg-badge {
      font-size: 10px;
      background: rgba(34,197,94,0.15);
      color: #22c55e;
      padding: 2px 8px;
      border-radius: 8px;
      margin-left: 4px;
    }

    .take-btn {
      width: 100%;
      height: 86px;
      border-radius: 22px;
      border: none;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      color: white;
      font-size: 20px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 6px 28px rgba(99,102,241,0.5);
      touch-action: manipulation;
      transition: transform 0.12s;
      animation: pulseBlue 2s ease-in-out infinite alternate;
      letter-spacing: 0.5px;
    }
    @keyframes pulseBlue {
      from { box-shadow: 0 6px 20px rgba(99,102,241,0.4); }
      to   { box-shadow: 0 6px 38px rgba(99,102,241,0.75); }
    }
    .take-btn:active { transform: scale(0.96); }
    .take-btn.capturing {
      background: linear-gradient(135deg, #f59e0b, #d97706) !important;
      animation: none;
    }
    .take-btn.done {
      background: linear-gradient(135deg, #22c55e, #16a34a) !important;
      animation: none;
    }

    .stop-btn {
      width: 100%;
      height: 50px;
      border-radius: 14px;
      border: 1.5px solid rgba(233,69,96,0.45);
      background: rgba(233,69,96,0.1);
      color: rgba(233,69,96,0.85);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      touch-action: manipulation;
      transition: transform 0.12s, background 0.15s;
    }
    .stop-btn:active { transform: scale(0.96); background: rgba(233,69,96,0.22); }

    .lock-tip {
      margin-top: 2px;
      background: rgba(99,102,241,0.08);
      border: 1px solid rgba(99,102,241,0.2);
      border-radius: 12px;
      padding: 9px 14px;
      font-size: 12px;
      color: rgba(255,255,255,0.5);
      line-height: 1.7;
      text-align: center;
    }
    .lock-tip strong { color: #818cf8; }

    .live-section {
      padding: 12px 16px 0;
      display: none;
    }
    .live-label {
      font-size: 10px;
      color: rgba(255,255,255,0.3);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .live-box {
      padding: 12px 14px;
      background: rgba(255,255,255,0.04);
      border-radius: 14px;
      font-size: 14px;
      color: rgba(255,255,255,0.35);
      font-style: italic;
      min-height: 52px;
      word-break: break-word;
      line-height: 1.65;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .live-box.has-text {
      color: rgba(255,255,255,0.88);
      font-style: normal;
    }

    .alert {
      margin: 10px 16px 0;
      background: rgba(233,69,96,0.1);
      border: 1px solid rgba(233,69,96,0.3);
      border-radius: 12px;
      padding: 11px 14px;
      font-size: 13px;
      color: rgba(255,255,255,0.82);
      line-height: 1.7;
      display: none;
    }

    .transcripts-section {
      flex: 1;
      padding: 14px 16px 80px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .tx-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .tx-title {
      font-size: 11px;
      font-weight: 600;
      color: rgba(255,255,255,0.3);
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .clear-btn {
      display: none;
      background: none;
      border: 1px solid rgba(233,69,96,0.4);
      color: rgba(233,69,96,0.75);
      font-size: 12px;
      padding: 4px 12px;
      border-radius: 20px;
      cursor: pointer;
      touch-action: manipulation;
    }
    .empty-msg {
      text-align: center;
      font-size: 14px;
      color: rgba(255,255,255,0.18);
      margin-top: 32px;
      line-height: 2.5;
    }

    .card {
      background: rgba(255,255,255,0.06);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 10px;
      animation: slideUp 0.3s ease;
    }
    @keyframes slideUp {
      from { opacity:0; transform:translateY(6px); }
      to   { opacity:1; transform:translateY(0); }
    }
    .card-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    .card-time { font-size: 12px; color: rgba(255,255,255,0.3); flex: 1; }
    .card-badge {
      font-size: 11px;
      background: rgba(99,102,241,0.2);
      color: #818cf8;
      padding: 2px 9px;
      border-radius: 9px;
    }
    .card-body {
      font-size: 15px;
      line-height: 1.65;
      color: white;
      word-break: break-word;
    }
    .card-body.no-speech {
      color: rgba(255,255,255,0.27);
      font-style: italic;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <p class="app-title">🎙️ SpeakUp</p>

    <div id="uiIdle">
      <button class="start-btn" onclick="startRec()">
        <span>▶</span><span>Start Recording</span>
      </button>
    </div>

    <div id="uiRec">
      <div class="rec-status">
        <div class="rec-dot"></div>
        <span class="rec-time" id="recTime">00:00:00</span>
        <span class="bg-badge">● BG Active</span>
      </div>

      <button class="take-btn" id="takeBtn" onclick="takeTranscript()">
        📋&nbsp;&nbsp;TAKE TRANSCRIPT
      </button>

      <button class="stop-btn" onclick="stopRec()">
        ⏹&nbsp;&nbsp;STOP
      </button>

      <div class="lock-tip">
        <strong>Lock screen:</strong> tap <strong>⏭ Next</strong> in media controls = Take Transcript
      </div>
    </div>
  </div>

  <div class="live-section" id="liveSection">
    <p class="live-label">🔴 Live · last 5 seconds</p>
    <div class="live-box" id="liveBox">Listening…</div>
  </div>

  <div id="alertBox" class="alert"></div>

  <div class="transcripts-section">
    <div class="tx-header">
      <span class="tx-title">Transcripts</span>
      <button class="clear-btn" id="clearBtn" onclick="clearAll()">Clear All</button>
    </div>
    <div id="cardList">
      <p class="empty-msg">Press <strong>Start Recording</strong><br>then tap <strong>Take Transcript</strong> anytime 📋</p>
    </div>
  </div>

<script>
// ─── State ───────────────────────────────────────────────────────────────────
let isRecording   = false;
let recognition   = null;
let liveTimer     = null;
let clockTimer    = null;
let startTime     = null;
let isTaking      = false;   // debounce: prevent double-tap

// ─── THE SINGLE SOURCE OF TRUTH ──────────────────────────────────────────────
// Each entry: { word: string, time: number (ms epoch) }
let wordLog = [];

// Interim (not yet final) from current recognition session
let interimText = '';
let interimTime = 0;

// ─── DOM refs ────────────────────────────────────────────────────────────────
const uiIdle     = document.getElementById('uiIdle');
const uiRec      = document.getElementById('uiRec');
const liveSection= document.getElementById('liveSection');
const liveBox    = document.getElementById('liveBox');
const alertBox   = document.getElementById('alertBox');
const cardList   = document.getElementById('cardList');
const clearBtn   = document.getElementById('clearBtn');
const recTime    = document.getElementById('recTime');
const takeBtn    = document.getElementById('takeBtn');

// ─── getLast5s ───────────────────────────────────────────────────────────────
// Returns text of words whose time is within [cutoff-5000, cutoff]
// Also purges entries older than cutoff-6000 from wordLog (safe margin)
function getLast5s(cutoff) {
  const keep = cutoff - 5000;
  const purge = cutoff - 6000;

  // Purge very old entries (more than 6s old) permanently
  wordLog = wordLog.filter(e => e.time >= purge);

  // Return only last 5s
  const words = wordLog.filter(e => e.time >= keep && e.time <= cutoff);
  return words.map(e => e.word).join(' ').trim();
}

// ─── updateLive ──────────────────────────────────────────────────────────────
// Called every 150ms — shows last 5s in liveBox
function updateLive() {
  const now = Date.now();
  let text = getLast5s(now);

  // Append interim if it's recent (within 5s)
  if (interimText && (now - interimTime) < 5000) {
    text = text ? text + ' ' + interimText : interimText;
  }

  if (text) {
    liveBox.textContent = text;
    liveBox.className = 'live-box has-text';
  } else {
    liveBox.textContent = 'Listening…';
    liveBox.className = 'live-box';
  }
}

// ─── takeTranscript ──────────────────────────────────────────────────────────
// Records the snapshot time, waits 1 second for delayed SR results, then saves.
function takeTranscript() {
  if (!isRecording || isTaking) return;
  isTaking = true;

  const snapTime = Date.now(); // moment button was pressed

  // Visual feedback: turn yellow "Capturing…"
  takeBtn.textContent = '⏳  Capturing…';
  takeBtn.classList.add('capturing');

  // Wait 1 second for any lagging SR results to arrive
  setTimeout(() => {
    // Collect all words from (snapTime - 5000) to (snapTime + 1000)
    const captureEnd = snapTime + 1000;
    const captureStart = snapTime - 5000;
    const captured = wordLog.filter(e => e.time >= captureStart && e.time <= captureEnd);

    // Also include interim if it arrived before captureEnd
    let text = captured.map(e => e.word).join(' ').trim();
    if (interimText && interimTime >= captureStart && interimTime <= captureEnd) {
      text = text ? text + ' ' + interimText : interimText;
    }

    // Remove captured words from log so they don't bleed into next take
    wordLog = wordLog.filter(e => e.time > captureEnd);
    interimText = '';
    interimTime = 0;

    // Save card
    addCard(text, snapTime);

    // Restore button
    takeBtn.textContent = '📋\u00A0\u00A0TAKE TRANSCRIPT';
    takeBtn.classList.remove('capturing');
    takeBtn.classList.add('done');
    setTimeout(() => takeBtn.classList.remove('done'), 600);

    isTaking = false;
  }, 1000);
}

// ─── addCard ─────────────────────────────────────────────────────────────────
function addCard(text, snapTime) {
  const empty = cardList.querySelector('.empty-msg');
  if (empty) empty.remove();

  const d = new Date(snapTime);
  const ts = d.toTimeString().slice(0,8);

  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="card-head">
      <span class="card-time">${ts}</span>
      <span class="card-badge">last 5 s</span>
    </div>
    <div class="card-body ${text ? '' : 'no-speech'}">
      ${text || '(no speech detected)'}
    </div>`;

  cardList.prepend(card);
  clearBtn.style.display = 'block';
}

// ─── Speech Recognition ──────────────────────────────────────────────────────
function startRecognition() {
  if (!isRecording) return;

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SR();
  recognition.lang = 'en-US';
  recognition.continuous = false;       // iOS requires false
  recognition.interimResults = true;
  recognition.maxAlternatives = 1;

  recognition.onresult = (e) => {
    const now = Date.now();
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const result = e.results[i];
      if (result.isFinal) {
        // Add each word individually with current timestamp
        const words = result[0].transcript.trim().split(/\s+/).filter(Boolean);
        words.forEach(w => wordLog.push({ word: w, time: now }));
        interimText = '';
        interimTime = 0;
      } else {
        // Store interim for live display only (not committed to wordLog yet)
        interimText = result[0].transcript.trim();
        interimTime = now;
      }
    }
  };

  recognition.onerror = (e) => {
    if (e.error === 'no-speech' || e.error === 'aborted') return; // normal on iOS
    showAlert('SR error: ' + e.error);
  };

  recognition.onend = () => {
    interimText = '';
    // Immediately restart if still recording
    if (isRecording) {
      setTimeout(() => startRecognition(), 80);
    }
  };

  try { recognition.start(); } catch(e) { /* already started */ }
}

// ─── Background audio (keeps iOS from suspending the tab) ────────────────────
let audioCtx = null;
function keepAlive() {
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 2, audioCtx.sampleRate);
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    src.loop = true;
    src.connect(audioCtx.destination);
    src.start();
  } catch(e) {}
}

// ─── MediaSession (lock screen ⏭ = Take Transcript) ─────────────────────────
function setupMediaSession() {
  if (!('mediaSession' in navigator)) return;
  navigator.mediaSession.metadata = new MediaMetadata({
    title: 'SpeakUp 🎤',
    artist: 'Recording in progress…',
    album: 'Tap ⏭ Next = Take Transcript'
  });
  navigator.mediaSession.setActionHandler('nexttrack', () => takeTranscript());
  navigator.mediaSession.setActionHandler('previoustrack', null);
  navigator.mediaSession.setActionHandler('play', null);
  navigator.mediaSession.setActionHandler('pause', null);
}

// ─── startRec ────────────────────────────────────────────────────────────────
async function startRec() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    showAlert('❌ Speech Recognition not supported. Please use Safari on iPhone.');
    return;
  }

  try {
    await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch(e) {
    showAlert('❌ Microphone access denied. Go to Settings → Safari → Microphone → Allow.');
    return;
  }

  hideAlert();
  isRecording = true;
  wordLog = [];
  interimText = '';
  interimTime = 0;
  startTime = Date.now();

  uiIdle.style.display = 'none';
  uiRec.style.display  = 'flex';
  liveSection.style.display = 'block';

  keepAlive();
  setupMediaSession();
  startRecognition();

  // Live update every 150ms
  liveTimer = setInterval(updateLive, 150);

  // Clock
  clockTimer = setInterval(() => {
    const s = Math.floor((Date.now() - startTime) / 1000);
    const h = String(Math.floor(s/3600)).padStart(2,'0');
    const m = String(Math.floor((s%3600)/60)).padStart(2,'0');
    const ss= String(s%60).padStart(2,'0');
    recTime.textContent = `${h}:${m}:${ss}`;
  }, 1000);
}

// ─── stopRec ─────────────────────────────────────────────────────────────────
function stopRec() {
  isRecording = false;
  if (recognition) { try { recognition.stop(); } catch(e){} recognition = null; }
  if (liveTimer)   { clearInterval(liveTimer);  liveTimer = null; }
  if (clockTimer)  { clearInterval(clockTimer); clockTimer = null; }
  if (audioCtx)    { try { audioCtx.close(); } catch(e){} audioCtx = null; }

  wordLog = [];
  interimText = '';
  interimTime = 0;

  uiIdle.style.display = 'block';
  uiRec.style.display  = 'none';
  liveSection.style.display = 'none';
  liveBox.textContent = 'Listening…';
  liveBox.className = 'live-box';
  recTime.textContent = '00:00:00';

  if ('mediaSession' in navigator) {
    try { navigator.mediaSession.setActionHandler('nexttrack', null); } catch(e){}
  }
}

// ─── clearAll ────────────────────────────────────────────────────────────────
function clearAll() {
  cardList.innerHTML = '<p class="empty-msg">Press <strong>Start Recording</strong><br>then tap <strong>Take Transcript</strong> anytime 📋</p>';
  clearBtn.style.display = 'none';
}

// ─── Alert helpers ───────────────────────────────────────────────────────────
function showAlert(msg) {
  alertBox.textContent = msg;
  alertBox.style.display = 'block';
}
function hideAlert() {
  alertBox.style.display = 'none';
}
</script>
</body>
</html>

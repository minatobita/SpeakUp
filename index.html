<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>SpeakUp</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0d0d1a;
      min-height: 100vh;
      color: white;
      display: flex;
      flex-direction: column;
    }

    .top-bar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: #0d0d1a;
      padding: env(safe-area-inset-top, 14px) 16px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }

    .app-title {
      text-align: center;
      font-size: 11px;
      color: rgba(255,255,255,0.28);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    /* START BUTTON */
    .start-btn {
      width: 100%;
      height: 80px;
      border-radius: 22px;
      border: none;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: white;
      font-size: 19px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      box-shadow: 0 6px 24px rgba(34,197,94,0.4);
      touch-action: manipulation;
      transition: transform 0.15s;
    }
    .start-btn:active { transform: scale(0.97); }

    /* RECORDING UI */
    #uiRec { display: none; flex-direction: column; gap: 10px; }

    .rec-status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .rec-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #e94560;
      animation: blink 1s ease-in-out infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.1} }
    .rec-time {
      font-size: 14px;
      font-weight: 600;
      color: rgba(255,255,255,0.55);
      font-variant-numeric: tabular-nums;
      letter-spacing: 1px;
    }
    .bg-badge {
      font-size: 10px;
      background: rgba(34,197,94,0.15);
      color: #22c55e;
      padding: 2px 8px;
      border-radius: 8px;
      margin-left: 4px;
    }

    /* TAKE TRANSCRIPT BUTTON – PRIMARY */
    .take-btn {
      width: 100%;
      height: 86px;
      border-radius: 22px;
      border: none;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      color: white;
      font-size: 20px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 6px 28px rgba(99,102,241,0.5);
      touch-action: manipulation;
      transition: transform 0.12s, background 0.2s;
      animation: pulseBlue 2s ease-in-out infinite alternate;
      letter-spacing: 0.5px;
    }
    @keyframes pulseBlue {
      from { box-shadow: 0 6px 20px rgba(99,102,241,0.4); }
      to   { box-shadow: 0 6px 38px rgba(99,102,241,0.75); }
    }
    .take-btn:active { transform: scale(0.96); }
    .take-btn.flash {
      background: linear-gradient(135deg, #22c55e, #16a34a) !important;
      animation: none;
    }

    /* STOP BUTTON – SECONDARY */
    .stop-btn {
      width: 100%;
      height: 50px;
      border-radius: 14px;
      border: 1.5px solid rgba(233,69,96,0.45);
      background: rgba(233,69,96,0.1);
      color: rgba(233,69,96,0.85);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      touch-action: manipulation;
      transition: transform 0.12s, background 0.15s;
    }
    .stop-btn:active { transform: scale(0.96); background: rgba(233,69,96,0.22); }

    /* LOCK SCREEN TIP */
    .lock-tip {
      margin-top: 2px;
      background: rgba(99,102,241,0.08);
      border: 1px solid rgba(99,102,241,0.2);
      border-radius: 12px;
      padding: 9px 14px;
      font-size: 12px;
      color: rgba(255,255,255,0.5);
      line-height: 1.7;
      text-align: center;
    }
    .lock-tip strong { color: #818cf8; }

    /* LIVE BOX */
    .live-section {
      padding: 12px 16px 0;
      display: none;
    }
    .live-label {
      font-size: 10px;
      color: rgba(255,255,255,0.3);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .live-box {
      padding: 12px 14px;
      background: rgba(255,255,255,0.04);
      border-radius: 14px;
      font-size: 14px;
      color: rgba(255,255,255,0.35);
      font-style: italic;
      min-height: 52px;
      word-break: break-word;
      line-height: 1.65;
      border: 1px solid rgba(255,255,255,0.06);
      transition: color 0.2s;
    }
    .live-box.has-text {
      color: rgba(255,255,255,0.88);
      font-style: normal;
    }

    /* ALERT */
    .alert {
      margin: 10px 16px 0;
      background: rgba(233,69,96,0.1);
      border: 1px solid rgba(233,69,96,0.3);
      border-radius: 12px;
      padding: 11px 14px;
      font-size: 13px;
      color: rgba(255,255,255,0.82);
      line-height: 1.7;
      display: none;
    }

    /* TRANSCRIPTS */
    .transcripts-section {
      flex: 1;
      padding: 14px 16px 80px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .tx-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .tx-title {
      font-size: 11px;
      font-weight: 600;
      color: rgba(255,255,255,0.3);
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .clear-btn {
      display: none;
      background: none;
      border: 1px solid rgba(233,69,96,0.4);
      color: rgba(233,69,96,0.75);
      font-size: 12px;
      padding: 4px 12px;
      border-radius: 20px;
      cursor: pointer;
      touch-action: manipulation;
    }
    .empty-msg {
      text-align: center;
      font-size: 14px;
      color: rgba(255,255,255,0.18);
      margin-top: 32px;
      line-height: 2.5;
    }

    /* CARD */
    .card {
      background: rgba(255,255,255,0.06);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 10px;
      animation: slideUp 0.3s ease;
    }
    @keyframes slideUp {
      from { opacity:0; transform:translateY(6px); }
      to   { opacity:1; transform:translateY(0); }
    }
    .card-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    .card-time { font-size: 12px; color: rgba(255,255,255,0.3); flex: 1; }
    .card-badge {
      font-size: 11px;
      background: rgba(99,102,241,0.2);
      color: #818cf8;
      padding: 2px 9px;
      border-radius: 9px;
    }
    .card-body {
      font-size: 15px;
      line-height: 1.65;
      color: white;
      word-break: break-word;
    }
    .card-body.no-speech {
      color: rgba(255,255,255,0.27);
      font-style: italic;
    }
  </style>
</head>
<body>

  <!-- TOP BAR -->
  <div class="top-bar">
    <p class="app-title">🎙️ SpeakUp</p>

    <!-- IDLE -->
    <div id="uiIdle">
      <button class="start-btn" onclick="startRecording()">
        <span>▶</span><span>Start Recording</span>
      </button>
    </div>

    <!-- RECORDING -->
    <div id="uiRec">
      <div class="rec-status">
        <div class="rec-dot"></div>
        <span class="rec-time" id="recTime">00:00:00</span>
        <span class="bg-badge">● BG Active</span>
      </div>

      <!-- PRIMARY: Take Transcript -->
      <button class="take-btn" id="takeBtn" onclick="takeTranscript()">
        📋&nbsp;&nbsp;TAKE TRANSCRIPT
      </button>

      <!-- SECONDARY: Stop -->
      <button class="stop-btn" onclick="stopRecording()">
        ⏹&nbsp;&nbsp;STOP
      </button>

      <div class="lock-tip">
        🔒 Lock screen: press <strong>⏭ Next</strong> in media controls<br>
        🎧 Earphones: <strong>double-press</strong> center button
      </div>
    </div>
  </div>

  <!-- LIVE BOX -->
  <div class="live-section" id="liveSection">
    <div class="live-label">🟢 Live · last 5 seconds</div>
    <div class="live-box" id="liveBox">🎤 Listening…</div>
  </div>

  <!-- ALERT -->
  <div class="alert" id="alertBox"></div>

  <!-- TRANSCRIPTS -->
  <div class="transcripts-section">
    <div class="tx-header">
      <span class="tx-title">Transcripts</span>
      <button class="clear-btn" id="clearBtn" onclick="clearCards()">Clear All</button>
    </div>
    <div id="transcriptList">
      <p class="empty-msg" id="emptyMsg">📭 No transcripts yet<br>Press Start → speak → Take Transcript</p>
    </div>
  </div>

<script>
// ============================================================
//  WORD LOG — single source of truth
//  Every confirmed word gets a timestamp estimated from its
//  position inside the phrase.  currentInterim holds words
//  that iOS hasn't confirmed yet (still being processed).
// ============================================================
let wordLog       = [];   // [{word, t}]  t = ms epoch
let currentInterim = '';  // unconfirmed fragment from iOS
let phraseStart   = 0;    // when current recognition session began

/** Spread words across [phraseStart … now] and push to wordLog */
function commitFinalPhrase(text) {
  const now   = Date.now();
  const words = text.trim().split(/\s+/).filter(Boolean);
  if (!words.length) return;
  const dur   = Math.max(now - phraseStart, 100);
  words.forEach((w, i) => {
    wordLog.push({ word: w, t: phraseStart + dur * (i + 1) / words.length });
  });
  phraseStart = now;   // next phrase starts from here
}

/** THE only function used by both liveBox and Take Transcript */
function getLast5s() {
  const cutoff = Date.now() - 5000;
  const finals = wordLog.filter(w => w.t >= cutoff).map(w => w.word).join(' ');
  const interim = currentInterim.trim();
  if (interim) return (finals + ' ' + interim).trim();
  return finals;
}

function purgeOldWords() {
  const cutoff = Date.now() - 30000;
  wordLog = wordLog.filter(w => w.t >= cutoff);
}

// ============================================================
//  RECOGNITION LOOP
// ============================================================
let recognition    = null;
let isRecording    = false;
let keepGoing      = false;

function buildRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    showAlert('⚠️ Speech recognition not supported. Please use Safari on iPhone.');
    return null;
  }
  const r          = new SR();
  r.lang           = 'en-US';
  r.continuous     = false;   // iOS ignores true; we loop manually
  r.interimResults = true;
  r.maxAlternatives = 1;

  r.onstart = () => { phraseStart = Date.now(); };

  r.onresult = (e) => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) {
        commitFinalPhrase(t);
        currentInterim = '';
      } else {
        interim += t;
      }
    }
    currentInterim = interim;
    renderLive();
  };

  r.onerror = (e) => {
    if (['no-speech', 'aborted'].includes(e.error)) return;
    console.warn('SR error:', e.error);
  };

  r.onend = () => {
    // Don't clear interim here — keep showing it until next result
    if (keepGoing && isRecording) {
      setTimeout(() => {
        if (!keepGoing || !isRecording) return;
        recognition = buildRecognition();
        if (recognition) { try { recognition.start(); } catch(e) {} }
      }, 80);
    }
  };

  return r;
}

// ============================================================
//  LIVE BOX  (updates every 150 ms for snappy 5-second trim)
// ============================================================
let liveTimer = null;

function renderLive() {
  const text = getLast5s();
  const box  = document.getElementById('liveBox');
  if (text) {
    box.textContent = text;
    box.classList.add('has-text');
  } else {
    box.textContent = '🎤 Listening…';
    box.classList.remove('has-text');
  }
}

function startLiveTimer() {
  liveTimer = setInterval(() => { renderLive(); purgeOldWords(); }, 150);
}
function stopLiveTimer() { clearInterval(liveTimer); liveTimer = null; }

// ============================================================
//  TIMER
// ============================================================
let timerSec = 0, timerHandle = null;

function startTimer() {
  timerSec = 0;
  clearInterval(timerHandle);
  timerHandle = setInterval(() => {
    timerSec++;
    const h = String(Math.floor(timerSec / 3600)).padStart(2, '0');
    const m = String(Math.floor((timerSec % 3600) / 60)).padStart(2, '0');
    const s = String(timerSec % 60).padStart(2, '0');
    document.getElementById('recTime').textContent = `${h}:${m}:${s}`;
  }, 1000);
}
function stopTimer() { clearInterval(timerHandle); }

// ============================================================
//  BACKGROUND AUDIO  (keeps Safari alive when screen locks)
// ============================================================
let audioCtx = null;

function startBgAudio() {
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const buf    = audioCtx.createBuffer(1, audioCtx.sampleRate, audioCtx.sampleRate);
    const src    = audioCtx.createBufferSource();
    src.buffer   = buf;
    src.loop     = true;
    src.connect(audioCtx.destination);
    src.start();
  } catch(e) { console.warn('BG audio failed', e); }
}
function stopBgAudio() {
  try { audioCtx && audioCtx.close(); } catch(e) {}
  audioCtx = null;
}

// ============================================================
//  MEDIA SESSION  (lock-screen ⏭ button → Take Transcript)
// ============================================================
function setupMediaSession() {
  if (!('mediaSession' in navigator)) return;
  navigator.mediaSession.metadata = new MediaMetadata({
    title: 'SpeakUp 🎤',
    artist: 'Tap ⏭ to Take Transcript',
    album: 'English Learning'
  });
  navigator.mediaSession.setActionHandler('nexttrack', takeTranscript);
  navigator.mediaSession.setActionHandler('previoustrack', takeTranscript);
}

// ============================================================
//  MIC UNLOCK
// ============================================================
async function unlockMic() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    stream.getTracks().forEach(t => t.stop());
    return true;
  } catch(e) {
    showAlert('⚠️ Microphone denied. Go to iPhone Settings → Safari → Microphone → Allow.');
    return false;
  }
}

// ============================================================
//  MAIN ACTIONS
// ============================================================
async function startRecording() {
  const ok = await unlockMic();
  if (!ok) return;

  // Reset data
  wordLog        = [];
  currentInterim = '';
  phraseStart    = Date.now();

  isRecording = true;
  keepGoing   = true;

  startBgAudio();
  setupMediaSession();
  startTimer();

  recognition = buildRecognition();
  if (recognition) { try { recognition.start(); } catch(e) {} }

  document.getElementById('uiIdle').style.display   = 'none';
  document.getElementById('uiRec').style.display     = 'flex';
  document.getElementById('liveSection').style.display = 'block';
  hideAlert();
  startLiveTimer();
}

function stopRecording() {
  isRecording = false;
  keepGoing   = false;

  try { recognition && recognition.abort(); } catch(e) {}
  recognition    = null;
  currentInterim = '';

  stopTimer();
  stopLiveTimer();
  stopBgAudio();

  document.getElementById('uiRec').style.display      = 'none';
  document.getElementById('uiIdle').style.display     = 'block';
  document.getElementById('liveSection').style.display = 'none';
  const box = document.getElementById('liveBox');
  box.textContent = '🎤 Listening…';
  box.classList.remove('has-text');
}

function takeTranscript() {
  // Capture the EXACT same text the liveBox is showing right now
  const text = getLast5s();

  // Flash button green as confirmation
  const btn = document.getElementById('takeBtn');
  btn.classList.add('flash');
  setTimeout(() => btn.classList.remove('flash'), 600);

  addCard(text);
}

// ============================================================
//  CARDS
// ============================================================
let cardCount = 0;

function addCard(text) {
  cardCount++;
  const emptyMsg = document.getElementById('emptyMsg');
  if (emptyMsg) emptyMsg.remove();
  document.getElementById('clearBtn').style.display = 'block';

  const time = new Date().toTimeString().slice(0, 8);
  const card = document.createElement('div');
  card.className = 'card';
  const hasText = text && text.trim().length > 0;
  card.innerHTML = `
    <div class="card-head">
      <span class="card-time">${time}</span>
      <span class="card-badge">#${cardCount}</span>
    </div>
    <div class="card-body${hasText ? '' : ' no-speech'}">
      ${hasText ? text : '(No speech in last 5 seconds)'}
    </div>`;
  const list = document.getElementById('transcriptList');
  list.insertBefore(card, list.firstChild);
}

function clearCards() {
  cardCount = 0;
  document.getElementById('transcriptList').innerHTML =
    '<p class="empty-msg" id="emptyMsg">📭 No transcripts yet<br>Press Start → speak → Take Transcript</p>';
  document.getElementById('clearBtn').style.display = 'none';
}

// ============================================================
//  ALERT
// ============================================================
function showAlert(msg) {
  const el = document.getElementById('alertBox');
  el.textContent = msg;
  el.style.display = 'block';
}
function hideAlert() {
  document.getElementById('alertBox').style.display = 'none';
}
</script>
</body>
</html>

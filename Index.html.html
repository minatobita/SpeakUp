<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>SpeakUp</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0d0d1a;
      min-height: 100vh;
      color: white;
      display: flex;
      flex-direction: column;
    }

    /* ── Sticky Top Bar ── */
    .top-bar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: #0d0d1a;
      padding: env(safe-area-inset-top, 14px) 16px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }

    .app-title {
      text-align: center;
      font-size: 11px;
      color: rgba(255,255,255,0.28);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    /* ── Start Button ── */
    .start-btn {
      width: 100%;
      height: 80px;
      border-radius: 22px;
      border: none;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: white;
      font-size: 19px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      box-shadow: 0 6px 24px rgba(34,197,94,0.4);
      touch-action: manipulation;
      transition: transform 0.15s;
    }
    .start-btn:active { transform: scale(0.97); }

    /* ── Recording UI ── */
    #uiRec { display: none; flex-direction: column; gap: 10px; }

    .rec-status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .rec-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #e94560;
      animation: blink 1s ease-in-out infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.1} }
    .rec-time {
      font-size: 14px;
      font-weight: 600;
      color: rgba(255,255,255,0.55);
      font-variant-numeric: tabular-nums;
      letter-spacing: 1px;
    }
    .bg-badge {
      font-size: 10px;
      background: rgba(34,197,94,0.15);
      color: #22c55e;
      padding: 2px 8px;
      border-radius: 8px;
      margin-left: 4px;
    }

    .btn-row { display: flex; gap: 10px; }

    /* ── Take Transcript Button ── */
    .take-btn {
      flex: 1;
      height: 62px;
      border-radius: 16px;
      border: 1.5px solid rgba(99,179,237,0.45);
      background: rgba(99,179,237,0.1);
      color: #63b3ed;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      touch-action: manipulation;
      transition: transform 0.12s, background 0.15s;
    }
    .take-btn:active { transform: scale(0.96); background: rgba(99,179,237,0.22); }

    /* ── Stop Button ── */
    .stop-btn {
      flex: 1;
      height: 62px;
      border-radius: 16px;
      border: none;
      background: #e94560;
      color: white;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 1.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      animation: pulseStop 1.8s ease-in-out infinite alternate;
      touch-action: manipulation;
      transition: transform 0.12s;
    }
    @keyframes pulseStop {
      from { box-shadow: 0 4px 14px rgba(233,69,96,0.4); }
      to   { box-shadow: 0 4px 34px rgba(233,69,96,0.8); }
    }
    .stop-btn:active { transform: scale(0.96); }

    /* ── Live 5s Window ── */
    .live-section {
      padding: 12px 16px 0;
      display: none;
    }
    .live-label {
      font-size: 10px;
      color: rgba(255,255,255,0.3);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .live-box {
      padding: 12px 14px;
      background: rgba(255,255,255,0.04);
      border-radius: 14px;
      font-size: 14px;
      color: rgba(255,255,255,0.4);
      font-style: italic;
      min-height: 52px;
      word-break: break-word;
      line-height: 1.65;
      border: 1px solid rgba(255,255,255,0.06);
      transition: color 0.2s;
    }
    .live-box.has-text {
      color: rgba(255,255,255,0.88);
      font-style: normal;
    }

    /* ── Alert ── */
    .alert {
      margin: 10px 16px 0;
      background: rgba(233,69,96,0.1);
      border: 1px solid rgba(233,69,96,0.3);
      border-radius: 12px;
      padding: 11px 14px;
      font-size: 13px;
      color: rgba(255,255,255,0.82);
      line-height: 1.7;
      display: none;
    }

    /* ── Background Tip ── */
    .bg-tip {
      margin: 10px 16px 0;
      background: rgba(99,179,237,0.06);
      border: 1px solid rgba(99,179,237,0.18);
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 12px;
      color: rgba(255,255,255,0.45);
      line-height: 1.8;
      display: none;
    }
    .bg-tip strong { color: #63b3ed; }

    /* ── Transcripts ── */
    .transcripts-section {
      flex: 1;
      padding: 14px 16px 80px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .tx-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .tx-title {
      font-size: 11px;
      font-weight: 600;
      color: rgba(255,255,255,0.3);
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .clear-btn {
      display: none;
      background: none;
      border: 1px solid rgba(233,69,96,0.4);
      color: rgba(233,69,96,0.75);
      font-size: 12px;
      padding: 4px 12px;
      border-radius: 20px;
      cursor: pointer;
      touch-action: manipulation;
    }
    .empty-msg {
      text-align: center;
      font-size: 14px;
      color: rgba(255,255,255,0.18);
      margin-top: 32px;
      line-height: 2.5;
    }

    /* ── Card ── */
    .card {
      background: rgba(255,255,255,0.06);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 10px;
      animation: slideUp 0.3s ease;
    }
    @keyframes slideUp {
      from { opacity:0; transform:translateY(6px); }
      to   { opacity:1; transform:translateY(0); }
    }
    .card-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    .card-time { font-size: 12px; color: rgba(255,255,255,0.3); flex: 1; }
    .card-badge {
      font-size: 11px;
      background: rgba(99,179,237,0.15);
      color: #63b3ed;
      padding: 2px 9px;
      border-radius: 9px;
    }
    .card-body {
      font-size: 15px;
      line-height: 1.65;
      color: white;
      word-break: break-word;
    }
    .card-body.no-speech {
      color: rgba(255,255,255,0.27);
      font-style: italic;
    }
  </style>
</head>
<body>

  <!-- ── Sticky Top Bar ── -->
  <div class="top-bar">
    <p class="app-title">🎙️ SpeakUp</p>

    <!-- IDLE -->
    <div id="uiIdle">
      <button class="start-btn" onclick="startRecording()">
        <span>▶</span><span>Start Recording</span>
      </button>
    </div>

    <!-- RECORDING -->
    <div id="uiRec">
      <div class="rec-status">
        <div class="rec-dot"></div>
        <span class="rec-time" id="recTime">00:00:00</span>
        <span class="bg-badge">● BG Active</span>
      </div>
      <div class="btn-row">
        <button class="take-btn" onclick="takeTranscript()">
          📋 Take Transcript
        </button>
        <button class="stop-btn" onclick="stopRecording()">
          ⏹ STOP
        </button>
      </div>
    </div>
  </div>

  <!-- Live 5s rolling window -->
  <div class="live-section" id="liveSection">
    <p class="live-label">🔴 Live · last 5 seconds</p>
    <div class="live-box" id="liveBox">🎤 Listening…</div>
  </div>

  <!-- Alert -->
  <div class="alert" id="alertBox"></div>

  <!-- Background tip -->
  <div class="bg-tip" id="bgTip">
    <strong>📱 バックグラウンドで使うには</strong><br>
    • Share → 「ホーム画面に追加」でアプリ化する<br>
    • 設定 → 画面表示と明るさ → 自動ロック → <strong>しない</strong><br>
    • ⚠️ Safariを完全に閉じると停止します（Web技術の制限）
  </div>

  <!-- Transcripts -->
  <div class="transcripts-section">
    <div class="tx-header">
      <span class="tx-title">📝 Transcripts</span>
      <button class="clear-btn" id="clearBtn" onclick="clearAll()">Clear All</button>
    </div>
    <p class="empty-msg" id="emptyMsg">
      <strong style="color:rgba(34,197,94,0.8)">Start</strong> を押して録音開始<br>
      話しながら <strong style="color:#63b3ed">Take Transcript</strong> を押すと<br>
      直前5秒の音声が文字起こしされます
    </p>
    <div id="cardList"></div>
  </div>

<script>
/* ═══════════════════════════════════════════════════
   STATE
═══════════════════════════════════════════════════ */
let recognizing    = false;
let recognition    = null;
// phraseBuffer stores ONLY final results with the timestamp they were received
// Each entry: { text: string, endTime: number (ms epoch) }
let phraseBuffer   = [];
let sessionInterim = '';   // current in-progress (non-final) text
let elapsedSec     = 0;
let elapsedTimer   = null;
let displayTimer   = null;
let audioCtx       = null;
let noSleepOsc     = null;

/* ═══════════════════════════════════════════════════
   START RECORDING
═══════════════════════════════════════════════════ */
async function startRecording() {
  // Step 1: unlock microphone explicitly — required by iOS
  try {
    await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    showAlert('⚠️ マイクへのアクセスが拒否されました。Safari の設定からマイクを許可してください。');
    return;
  }

  // Step 2: keep page alive (silent audio)
  enableNoSleep();

  // Step 3: reset state
  recognizing    = true;
  phraseBuffer   = [];
  sessionInterim = '';
  elapsedSec     = 0;

  // Step 4: show UI
  document.getElementById('uiIdle').style.display   = 'none';
  document.getElementById('uiRec').style.display    = 'flex';
  document.getElementById('liveSection').style.display = 'block';
  document.getElementById('bgTip').style.display    = 'block';

  // Step 5: elapsed clock
  elapsedTimer = setInterval(() => {
    elapsedSec++;
    const h = String(Math.floor(elapsedSec / 3600)).padStart(2, '0');
    const m = String(Math.floor((elapsedSec % 3600) / 60)).padStart(2, '0');
    const s = String(elapsedSec % 60).padStart(2, '0');
    document.getElementById('recTime').textContent = `${h}:${m}:${s}`;
  }, 1000);

  // Step 6: live box refresh (prunes phrases older than 5s)
  displayTimer = setInterval(updateLiveBox, 300);

  // Step 7: start recognition loop
  startRecognition();
}

/* ═══════════════════════════════════════════════════
   RECOGNITION LOOP
   - continuous = false  (iOS requirement)
   - onend auto-restarts while recognizing = true
   - ONLY final results are pushed to phraseBuffer
═══════════════════════════════════════════════════ */
function startRecognition() {
  if (!recognizing) return;

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    showAlert('⚠️ Speech Recognition は iPhone の Safari でのみ動作します。');
    return;
  }

  recognition = new SR();
  recognition.continuous      = false;  // iOS does NOT support true
  recognition.interimResults  = true;
  recognition.lang            = 'en-US';
  recognition.maxAlternatives = 1;

  recognition.onresult = (e) => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const r = e.results[i];
      if (r.isFinal) {
        const text = r[0].transcript.trim();
        if (text) {
          // Store with the time the final result arrived
          phraseBuffer.push({ text, endTime: Date.now() });
          // Keep only last 60 s in memory
          prunePhraseBuffer(60000);
        }
        sessionInterim = '';
      } else {
        interim += r[0].transcript;
      }
    }
    sessionInterim = interim;
    updateLiveBox();
  };

  recognition.onend = () => {
    sessionInterim = '';
    if (recognizing) {
      // Restart after short delay — keeps recording indefinitely
      setTimeout(startRecognition, 150);
    }
  };

  recognition.onerror = (e) => {
    // 'not-allowed' = mic blocked → stop everything
    if (e.error === 'not-allowed') {
      showAlert('⚠️ マイクがブロックされています。Safari の設定でこのサイトのマイクを許可してください。');
      stopRecording();
    }
    // 'no-speech', 'network', 'aborted' → onend will restart automatically
  };

  try {
    recognition.start();
  } catch (e) {
    setTimeout(startRecognition, 300);
  }
}

/* ═══════════════════════════════════════════════════
   LIVE BOX — shows only last 5 seconds
═══════════════════════════════════════════════════ */
function updateLiveBox() {
  const recent = getRecentPhrases(5000);
  const text   = (recent.map(p => p.text).join(' ') + ' ' + sessionInterim).trim();
  const box    = document.getElementById('liveBox');

  if (text) {
    box.textContent = text;
    box.classList.add('has-text');
  } else {
    box.textContent = '🎤 Listening…';
    box.classList.remove('has-text');
  }
}

/* ═══════════════════════════════════════════════════
   TAKE TRANSCRIPT — snapshot of last 5 seconds
   Recording continues uninterrupted.
═══════════════════════════════════════════════════ */
function takeTranscript() {
  const recent = getRecentPhrases(5000);
  // Also include any interim text that is currently in-flight
  const text   = (recent.map(p => p.text).join(' ') + ' ' + sessionInterim).trim();
  addCard(text || null);
}

/* ═══════════════════════════════════════════════════
   STOP
═══════════════════════════════════════════════════ */
function stopRecording() {
  recognizing = false;

  if (recognition) {
    try { recognition.stop(); } catch (e) {}
    recognition = null;
  }

  clearInterval(elapsedTimer);
  clearInterval(displayTimer);
  disableNoSleep();

  sessionInterim = '';

  document.getElementById('uiRec').style.display       = 'none';
  document.getElementById('uiIdle').style.display      = 'block';
  document.getElementById('liveSection').style.display = 'none';
  document.getElementById('bgTip').style.display       = 'none';

  const box = document.getElementById('liveBox');
  box.textContent = '🎤 Listening…';
  box.classList.remove('has-text');
}

/* ═══════════════════════════════════════════════════
   ADD CARD
═══════════════════════════════════════════════════ */
function addCard(text) {
  document.getElementById('emptyMsg').style.display = 'none';
  document.getElementById('clearBtn').style.display = 'block';

  const timeStr = new Date().toLocaleTimeString('ja-JP', {
    hour: '2-digit', minute: '2-digit', second: '2-digit'
  });

  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="card-head">
      <span class="card-time">${timeStr}</span>
      <span class="card-badge">last 5 s</span>
    </div>
    <div class="card-body ${!text ? 'no-speech' : ''}">
      ${text ? escHtml(text) : '(No speech detected in the last 5 seconds)'}
    </div>`;

  const list = document.getElementById('cardList');
  list.insertBefore(card, list.firstChild);
}

/* ═══════════════════════════════════════════════════
   CLEAR ALL
═══════════════════════════════════════════════════ */
function clearAll() {
  document.getElementById('cardList').innerHTML      = '';
  document.getElementById('emptyMsg').style.display = 'block';
  document.getElementById('clearBtn').style.display = 'none';
}

/* ═══════════════════════════════════════════════════
   ALERT
═══════════════════════════════════════════════════ */
function showAlert(msg) {
  const el = document.getElementById('alertBox');
  el.textContent   = msg;
  el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 9000);
}

/* ═══════════════════════════════════════════════════
   NOSLEEP
   Silent oscillator keeps the AudioContext (and the
   iOS audio session) alive so Safari does not suspend
   the tab while the screen is on.
═══════════════════════════════════════════════════ */
function enableNoSleep() {
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc  = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    gain.gain.value = 0.001;   // nearly silent
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    noSleepOsc = osc;
  } catch (e) { /* non-fatal */ }
}

function disableNoSleep() {
  try { if (noSleepOsc) noSleepOsc.stop(); } catch (e) {}
  try { if (audioCtx)   audioCtx.close();  } catch (e) {}
  noSleepOsc = null;
  audioCtx   = null;
}

/* ═══════════════════════════════════════════════════
   HELPERS
═══════════════════════════════════════════════════ */
function getRecentPhrases(windowMs) {
  const cutoff = Date.now() - windowMs;
  return phraseBuffer.filter(p => p.endTime >= cutoff);
}

function prunePhraseBuffer(maxAgeMs) {
  const cutoff = Date.now() - maxAgeMs;
  phraseBuffer = phraseBuffer.filter(p => p.endTime >= cutoff);
}

function escHtml(s) {
  return s
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}
</script>
</body>
</html>
